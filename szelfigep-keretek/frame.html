<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bangers;src:url(bangers-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Figtree;src:url(figtree-latin-800-normal.woff2) format('woff2');font-weight:800}
html,body{margin:0;background:transparent}
:root{--ink:#0f0d0a;--paper:#fffbe8;--lime:#c6f432;--lemon:#fff04a;--pop:#ff4d6d;--navy:#15111d}
.f{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:Figtree}
/* külső keret */
.edge{position:absolute;inset:0;border:26px solid var(--ink);box-sizing:border-box}
.edge:after{content:"";position:absolute;inset:0;border:10px solid var(--lime)}
/* alsó sáv */
.band{z-index:1;position:absolute;left:0;right:0;bottom:0;height:var(--BH);background:var(--navy);
 background-image:radial-gradient(circle at 10% 30%,rgba(198,244,50,.25),transparent 40%),radial-gradient(circle at 90% 80%,rgba(255,77,109,.3),transparent 45%),radial-gradient(#2a2238 2.4px,transparent 3px);background-size:100% 100%,100% 100%,24px 24px;border-top:14px solid var(--ink)}
.mont{position:absolute;inset:0;overflow:hidden;opacity:.12;filter:saturate(.6)}
.mont img{position:absolute}
.band:before{content:"";position:absolute;left:0;right:0;top:-32px;height:18px;background:var(--lemon);border-top:7px solid var(--ink);border-bottom:7px solid var(--ink)}
.name{z-index:5;position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);bottom:var(--NB);font:var(--NS)/.9 Bangers;letter-spacing:.04em;color:var(--pop);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:10px 10px 0 var(--ink);white-space:nowrap}
.sub{z-index:5;position:absolute;left:50%;transform:translateX(-50%);bottom:var(--SB);font:800 var(--SS) Figtree;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--ink);padding:10px 22px;border:5px solid var(--paper);box-shadow:8px 8px 0 var(--lime);white-space:nowrap}
.n29{z-index:5;position:absolute;top:var(--NT);left:var(--NL);transform:rotate(-6deg);font:var(--N29)/.85 Bangers;color:var(--lemon);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink)}
.n29 small{display:block;font:800 var(--N29S) Figtree;letter-spacing:.2em;color:var(--ink);background:var(--pop);padding:6px 16px;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);-webkit-text-stroke:0;text-shadow:none;transform:rotate(3deg);width:max-content;margin-top:8px}
.qr{z-index:5;position:absolute;left:var(--QL);bottom:var(--QB);background:var(--paper);border:5px solid var(--ink);box-shadow:7px 7px 0 var(--lime);padding:var(--QP);display:flex;flex-direction:column;align-items:center;gap:8px}
.qr img{width:var(--QS);height:var(--QS);display:block}
.qr span{font:800 var(--QT) Figtree;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);line-height:1}
.stk{z-index:2;position:absolute;filter:drop-shadow(7px 9px 0 rgba(0,0,0,.5))}
.hd{z-index:2;position:absolute;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.5))}
</style></head><body><div class="f" id="f"></div>
<script>
const q=new URLSearchParams(location.search), W=+q.get("w"), H=+q.get("h"), P=W<H;
const r=document.documentElement.style; r.setProperty("--W",W+"px"); r.setProperty("--H",H+"px");
r.setProperty("--BH",(P?330:260)+"px"); r.setProperty("--NS",(P?150:128)+"px"); r.setProperty("--NB",(P?118:92)+"px");
r.setProperty("--SS",(P?30:26)+"px"); r.setProperty("--SB",(P?50:36)+"px");
r.setProperty("--QS",(P?150:128)+"px"); r.setProperty("--QP",(P?12:10)+"px"); r.setProperty("--QT",(P?16:14)+"px"); r.setProperty("--QL",(P?60:56)+"px"); r.setProperty("--QB",(P?62:44)+"px");
r.setProperty("--N29",(P?190:160)+"px"); r.setProperty("--N29S",(P?22:20)+"px"); r.setProperty("--NT",(P?48:40)+"px"); r.setProperty("--NL",(P?60:52)+"px");
const f=document.getElementById("f");
f.innerHTML=`<div class="edge"></div><div class="band"><div class="mont" id="mont"></div></div>
<div class="name">BAKESZOM</div><div class="sub">2026 · NOVEMBER</div>
<div class="qr"><img src="qr.svg" alt=""><span>Játék</span></div>
<div class="n29">29<small>SZÜLINAP</small></div>`;
function stk(i,x,y,w,rot){const e=document.createElement("img");e.className="stk";e.src=`stk/stk-${i}.webp`;Object.assign(e.style,{left:x+"px",top:y+"px",width:w+"px",transform:`rotate(${rot}deg)`});f.appendChild(e)}
function hd(n,x,y,w,rot){const e=document.createElement("img");e.className="hd";e.src=`${n}.png`;Object.assign(e.style,{left:x+"px",top:y+"px",width:w+"px",transform:`rotate(${rot}deg)`});f.appendChild(e)}
// halvány montázs az alsó sávban: mind a 17 matrica
const m=document.getElementById("mont"), BH=P?330:260, cols=P?6:8, cw=W/cols;
for(let i=0;i<17;i++){const e=document.createElement("img");e.src=`stk/stk-${i+1}.webp`;const col=i%cols,row=Math.floor(i/cols);
  Object.assign(e.style,{left:(col*cw-cw*.15+((row%2)?cw*.5:0))+"px",top:(row*(BH*.55)-BH*.2)+"px",width:(cw*1.3)+"px",transform:`rotate(${(i*37%24)-12}deg)`});m.appendChild(e)}
// erős matricák nincsenek a kereten – a szelfigépben külön rakhatók fel
</script></body></html>
