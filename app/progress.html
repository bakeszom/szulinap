<!--
  ÁDÁM SZÜLINAPI KIJELZŐ — gyűjtés + side quest ranglista
  ------------------------------------------------------------------
  Dávidnak — így lehet adatot adni neki (bármelyik működik):

  1) JS API (ha ugyanabban az oldalban fut a terminál-kód):
       progress.add(3000, { name: "Peti", item: "Becenév", nickname: "Kapitány" })
       progress.setTotal(47500)
       progress.setNickname("Kapitány")

  2) postMessage (ha iframe-be teszitek):
       iframe.contentWindow.postMessage({ type: "add", amount: 3000, name: "Peti" }, "*")
       iframe.contentWindow.postMessage({ type: "total", total: 47500 }, "*")

  3) JSON-feed lekérdezés (?feed=URL, 3 mp-enként):
       progress.html?feed=https://…/allas.json
     A JSON: { "total": 47500, "count": 12, "max": 10000, "nickname": "Kapitány",
               "last": { "id": "tx-123", "amount": 3000, "name": "Peti", "item": "Becenév" } }

  Éles módban (?live vagy ?feed=…) eltűnnek a demó gombok. "D" billentyű: demó gombok ki/be.
  Saját fej: tegyél egy átlátszó hátterű, kivágott fejfotót ide: img/adam-fej.png (négyzetes, ~600px).
-->

<style>
/* Layout: felül három oszlop (ranglista · gyűjtés + metrikák · mérföldkő-lista), alul a kanyargó borbélyrúd-pálya, amin a nagyfejű Ádám fut. */
:root {
  --night: #15111d;
  --night-dot: #2a2238;
  --paper: #fffbe8;
  --ink: #0f0d0a;
  --lime: #c6f432;
  --lemon: #fff04a;
  --dim: #3a3346;
  --dim-2: #4d4559;
  --pop: #ff4d6d;
  --muted: #6b6474;
  --font-display: "Bangers", "Impact", "Arial Black", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image: radial-gradient(var(--night-dot) 1.6px, transparent 1.7px);
  background-size: 14px 14px;
  color: var(--paper);
  font: 16px/1.4 var(--font-body);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 10px;
}

/* ---------- felső panelek ---------- */
.hud {
  display: grid;
  grid-template-columns: 1fr 1.35fr 1.15fr;
  gap: 18px;
  align-items: start;
}
.panel {
  background: var(--paper);
  color: var(--ink);
  border: 4px solid var(--ink);
  border-radius: 6px;
  box-shadow: 7px 7px 0 var(--ink);
  padding: 14px 18px 16px;
  min-width: 0;
}
.kicker {
  font: 700 12px/1 var(--font-body);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font: 400 clamp(30px, 3.4vw, 54px)/.9 var(--font-display);
  letter-spacing: .02em;
  color: var(--lemon);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 4px 4px 0 var(--ink);
  text-wrap: balance;
}
.center { display: grid; gap: 12px; min-width: 0; }
.raised {
  font: 400 clamp(26px, 2.4vw, 40px)/1 var(--font-display); letter-spacing: .03em;
  color: var(--lemon); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink);
}
.total {
  display: inline-flex; align-items: baseline; gap: 10px;
  background: var(--lime); color: var(--ink);
  border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
  padding: 6px 20px 2px; border-radius: 6px; width: fit-content;
  transform: rotate(-1.5deg);
}
.total b { font: 400 clamp(52px, 6vw, 104px)/1 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.total span { font: 400 clamp(24px, 2.4vw, 42px)/1 var(--font-display); }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 4px; padding: 6px 10px 5px; min-width: 0; }
.metric .k { font: 700 10.5px/1.1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.metric .v { font: 400 clamp(22px, 2vw, 32px)/1.05 var(--font-display); letter-spacing: .03em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric.clock { background: var(--lemon); }
.total.bump { animation: bump .5s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 0% { transform: rotate(-1.5deg) scale(1); } 40% { transform: rotate(2deg) scale(1.12); } 100% { transform: rotate(-1.5deg) scale(1); } }
.nick { font: 700 15px/1.2 var(--font-body); color: var(--paper); }
.nick q { font: 400 24px/1 var(--font-display); color: var(--lime); letter-spacing: .04em; quotes: "„" "”"; }

.next { padding: 10px 16px 12px; }
.next h2 {
  margin: 4px 0 2px;
  font: 400 clamp(24px, 2.2vw, 34px)/1 var(--font-display);
  letter-spacing: .03em;
  text-wrap: balance;
}
.next .task { font: 700 clamp(14px, 1.15vw, 18px)/1.3 var(--font-body); margin: 0 0 8px; max-width: 46ch; }
.next .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  font: 400 20px/1 var(--font-display); letter-spacing: .04em;
  border: 3px solid var(--ink); border-radius: 4px; padding: 5px 9px 3px;
  background: var(--lemon);
}
.chip.task { background: var(--pop); color: var(--paper); }
.chip.trophy { background: var(--lime); }
.chip.left { background: transparent; }

.miles h3 { margin: 4px 0 8px; font: 400 26px/1 var(--font-display); letter-spacing: .04em; }
.miles ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.miles li { display: grid; grid-template-columns: 74px 1fr; gap: 9px; align-items: baseline; font-size: 13px; line-height: 1.2; padding: 2px 4px; border-radius: 3px; }
.miles li b {
  font: 400 16px/1 var(--font-display); letter-spacing: .03em; font-variant-numeric: tabular-nums;
  background: var(--ink); color: var(--lemon); padding: 3px 6px 1px; border-radius: 3px; text-align: right;
}
.miles li .nm { font-weight: 900; }
.miles li .tx { color: #3d3846; }
.miles li.task .nm::before { content: "!"; display: inline-block; width: 15px; height: 15px; margin-right: 5px; border-radius: 50%; background: var(--pop); color: var(--paper); border: 2px solid var(--ink); font: 400 11px/12px var(--font-display); text-align: center; vertical-align: 1px; }
.miles li.done { opacity: .45; }
.miles li.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
.miles li.done b { background: var(--lime); color: var(--ink); }
.miles li.next { background: var(--lemon); outline: 3px solid var(--ink); opacity: 1; }
.miles li.next b { background: var(--pop); color: var(--paper); }

/* ---------- ranglista ---------- */
.board { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 7px 7px 0 var(--lime); outline: 3px solid var(--paper); outline-offset: -7px; }
.board .kicker { color: var(--lime); }
.board h3 { margin: 4px 0 8px; font: 400 26px/1 var(--font-display); letter-spacing: .04em; color: var(--lemon); }
.board ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.board li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; font: 700 15px/1.2 var(--font-body); }
.board li:first-child { grid-template-columns: 44px 1fr auto; font-size: 22px; padding: 4px 0 6px; border-bottom: 2px dashed rgba(255,251,232,.25); margin-bottom: 2px; }
.board li:first-child .pos { font-size: 30px; }
.board li:first-child .pt { font-size: 32px; color: var(--lemon); }
.board li .pos { font: 400 20px/1 var(--font-display); text-align: center; border: 2px solid var(--paper); border-radius: 3px; padding: 3px 0 1px; }
.board li:nth-child(1) .pos { background: var(--lemon); color: var(--ink); border-color: var(--lemon); }
.board li:nth-child(2) .pos { background: var(--paper); color: var(--ink); }
.board li:nth-child(3) .pos { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.board li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board li .pt { font: 400 20px/1 var(--font-display); letter-spacing: .03em; color: var(--lime); font-variant-numeric: tabular-nums; }
.board li .pt small { font: 700 11px/1 var(--font-body); color: var(--paper); opacity: .6; margin-left: 4px; }
.board li.up { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { background: rgba(198,244,50,.45); } 100% { background: transparent; } }
.board .empty { font-size: 14px; opacity: .7; }
.board .note { margin-top: 8px; font: 700 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; opacity: .5; }

/* ---------- pálya ---------- */
.scene { flex: 1; min-height: 0; position: relative; margin-top: 4px; }
.scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
.stripes-move { animation: roll .9s linear infinite; }
@keyframes roll { to { stroke-dashoffset: -52; } }
.sign text { font-family: var(--font-display); }
.sign .amt { font-size: 22px; letter-spacing: .03em; }
.sign .nm { font-family: var(--font-body); font-weight: 800; font-size: 13px; }

/* ---------- mérföldkő-popup ---------- */
.pop {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
  background: rgba(15, 13, 10, .55);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.pop .card {
  position: relative; max-width: 820px; width: 100%;
  background: var(--lemon); color: var(--ink);
  border: 6px solid var(--ink); border-radius: 8px; box-shadow: 14px 14px 0 var(--ink);
  padding: 28px 34px 30px; text-align: center;
  background-image: radial-gradient(rgba(15,13,10,.13) 2px, transparent 2.2px); background-size: 12px 12px;
  animation: slam .55s cubic-bezier(.2,1.6,.4,1);
}
.pop .card.trophy { background-color: var(--lime); }
@keyframes slam { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.06) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(-1deg); } }
.pop .boom {
  position: absolute; top: -46px; left: 50%; transform: translateX(-50%) rotate(-4deg);
  font: 400 clamp(36px, 5vw, 64px)/1 var(--font-display); letter-spacing: .04em;
  background: var(--pop); color: var(--paper); border: 5px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  padding: 8px 22px 4px; white-space: nowrap;
}
.pop .amt { font: 400 clamp(30px, 4vw, 52px)/1 var(--font-display); margin-top: 10px; }
.pop h2 { font: 400 clamp(44px, 7vw, 104px)/.95 var(--font-display); margin: 6px 0 12px; letter-spacing: .02em; text-wrap: balance; }
.pop p { font: 800 clamp(18px, 2.2vw, 30px)/1.25 var(--font-body); margin: 0 auto; max-width: 30ch; text-wrap: balance; }

/* ---------- demó gombok ---------- */
.demo {
  position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; z-index: 30; justify-content: flex-end;
}
.demo button {
  font: 400 17px/1 var(--font-display); letter-spacing: .04em;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 7px 10px 5px; border-radius: 4px; cursor: pointer;
}
.demo button:hover { background: var(--lemon); }
.demo button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
.demo .tag { align-self: center; font: 700 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--paper); opacity: .6; }

@media (max-width: 1300px) {
  body { overflow: auto; }
  .hud { grid-template-columns: 1fr 1fr; }
  .center { grid-column: 1 / -1; order: -1; }
  .scene { min-height: 360px; }
}
@media (max-width: 700px) {
  .hud { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scene { min-height: 280px; }
}
@media (prefers-reduced-motion: reduce) {
  .stripes-move, .total.bump, .pop .card { animation: none; }
}
</style>

// Ranglista: ugyanaz a Supabase, mint a buliappban (app/index.html)

/* ================== segédek ================== */
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const fmt = n => Math.round(n).toLocaleString("hu-HU").replace(/ /g, " ");
const params = new URLSearchParams(location.search);
const LIVE = params.has("live") || params.has("feed");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================== pálya ================== */
// töréspontok: rajt balra lent → domb → völgy → fal → plató → csúcs (cél)
const PTS = [[50,520],[330,520],[420,370],[640,370],[720,500],[950,500],[1030,270],[1210,270],[1280,410],[1400,410],[1490,170],[1560,170]];
function roundedPath(pts, r) {
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy);
    const r1 = Math.min(r, l1 / 2), r2 = Math.min(r, l2 / 2);
    d += ` L ${cx - (cx - px) / l1 * r1} ${cy - (cy - py) / l1 * r1}`;
    d += ` Q ${cx} ${cy} ${cx + (nx - cx) / l2 * r2} ${cy + (ny - cy) / l2 * r2}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L ${last[0]} ${last[1]}`;
}
const D = roundedPath(PTS, 60);
const track = $("track");
el("path", { d: D, fill: "none", stroke: "#0f0d0a", "stroke-width": 50, "stroke-linecap": "round", "stroke-linejoin": "round" }, track);
el("path", { d: D, fill: "none", stroke: "#3a3346", "stroke-width": 36, "stroke-linecap": "round", "stroke-linejoin": "round" }, track);
el("path", { d: D, fill: "none", stroke: "#4d4559", "stroke-width": 36, "stroke-dasharray": "26 26", "stroke-linejoin": "round" }, track);
const fill = el("g", { mask: "url(#fillMask)" }, track);
el("path", { d: D, fill: "none", stroke: "#c6f432", "stroke-width": 36, "stroke-linecap": "round", "stroke-linejoin": "round" }, fill);
el("path", { d: D, fill: "none", stroke: "#fff04a", "stroke-width": 36, "stroke-dasharray": "26 26", "stroke-linejoin": "round", class: reduced ? "" : "stripes-move" }, fill);
el("path", { d: D, fill: "none", stroke: "rgba(255,255,255,.4)", "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round", transform: "translate(0,-10)" }, track);
el("path", { d: D, fill: "none", stroke: "rgba(0,0,0,.25)", "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round", transform: "translate(0,11)" }, track);

const pathEl = el("path", { d: D, fill: "none", stroke: "none" }, track);
const LEN = pathEl.getTotalLength();
const maskPath = $("maskPath"); maskPath.setAttribute("d", D);

// mérföldkövek egyenletesen elosztva a pályán (így a sűrű 0–75k sáv kapja a hely nagyját)
const N = MILESTONES.length;
const fracOf = i => i / (N - 1);
function amountToFrac(a) {
  if (a <= 0) return 0;
  for (let i = 1; i < N; i++) {
    if (a <= MILESTONES[i].a) {
      const a0 = MILESTONES[i - 1].a, a1 = MILESTONES[i].a;
      return fracOf(i - 1) + (a - a0) / (a1 - a0) * (fracOf(i) - fracOf(i - 1));
    }
  }
  return 1;
}
const ptAt = f => pathEl.getPointAtLength(Math.max(0, Math.min(1, f)) * LEN);

/* ---------- táblák ---------- */
const signs = $("signs");
const signEls = [];
MILESTONES.forEach((m, i) => {
  const p = ptAt(fracOf(i));
  const up = i % 2 === 0;
  const g = el("g", { class: "sign" }, signs);
  const postEnd = up ? p.y - 44 : p.y + 40;
  el("line", { x1: p.x, y1: p.y, x2: p.x, y2: postEnd, stroke: "#0f0d0a", "stroke-width": 5 }, g);
  el("circle", { cx: p.x, cy: p.y, r: 11, fill: "#fffbe8", stroke: "#0f0d0a", "stroke-width": 4 }, g);
  const box = el("g", {}, g);
  const amtTxt = m.a >= 1000000 ? "1 MILLIÓ" : (m.a === 0 ? "0 FT" : fmt(m.a));
  const t1 = el("text", { class: "amt", x: p.x, y: 0, "text-anchor": "middle", fill: "#0f0d0a" }, box); t1.textContent = amtTxt;
  const t2 = el("text", { class: "nm", x: p.x, y: 0, "text-anchor": "middle", fill: "#0f0d0a" }, box); t2.textContent = m.n.toUpperCase();
  const h = 46, w = Math.max(t1.getComputedTextLength ? Math.max(t1.getComputedTextLength(), t2.getComputedTextLength()) : 90, 60) + 22;
  const top = up ? postEnd - h : postEnd;
  const rect = el("rect", { x: p.x - w / 2, y: top, width: w, height: h, rx: 4, fill: "#fff04a", stroke: "#0f0d0a", "stroke-width": 4 });
  box.insertBefore(rect, t1);
  t1.setAttribute("y", top + 22); t2.setAttribute("y", top + 38);
  if (m.kind === "task") {
    const bx = p.x + w / 2 - 2, by = top - 2;
    el("circle", { cx: bx, cy: by, r: 11, fill: "#ff4d6d", stroke: "#0f0d0a", "stroke-width": 3 }, g);
    const ex = el("text", { x: bx, y: by + 6, "text-anchor": "middle", fill: "#fffbe8", "font-size": 17, "font-family": "Bangers, Impact, sans-serif" }, g); ex.textContent = "!";
  }
  signEls.push({ rect, dot: g.querySelector("circle") });
});
// célzászló
(() => {
  const p = ptAt(1);
  el("line", { x1: p.x + 14, y1: p.y, x2: p.x + 14, y2: p.y - 120, stroke: "#0f0d0a", "stroke-width": 6 }, signs);

})();

const armB = el("line", { x1: 0, y1: -60, x2: 0, y2: -36, stroke: "#0f0d0a", "stroke-width": 8, "stroke-linecap": "round" }, body);
el("rect", { x: -17, y: -70, width: 34, height: 40, rx: 10, fill: "#c6f432", stroke: "#0f0d0a", "stroke-width": 5 }, body);

let bubbleUntil = 0;
function say(text, ms = 3500) {

/* ================== állapot ================== */
const S = { count: 0, max: 0, total: 0, shown: 0, pos: 0, target: 0, nick: "", seen: new Set(), queue: [], popOpen: false };
function store(k, v) { try { localStorage.setItem("adamfut:" + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem("adamfut:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

function nextIndex(total) { const i = MILESTONES.findIndex(m => m.a > total); return i === -1 ? N : i; }

function renderHud() {
  const i = nextIndex(S.total);
  if (i < N) {
    const m = MILESTONES[i];
    $("nextName").textContent = m.n;
    $("nextTask").textContent = m.t;
    $("nextAmt").textContent = m.a >= 1000000 ? "1 000 000 Ft" : fmt(m.a) + " Ft";
    const k = $("nextKind");
    k.hidden = !m.kind;
    k.textContent = m.kind === "task" ? "Ádám feladata" : "Poén-mérföldkő";
    k.className = "chip " + (m.kind === "trophy" ? "trophy" : "task");
    $("nextLeft").textContent = "még " + fmt(m.a - S.total) + " Ft";
  } else {
    $("nextName").textContent = "Célba ért!";
    $("nextTask").textContent = "Egymillió felett. Ez már legenda.";
    $("nextAmt").textContent = fmt(S.total) + " Ft"; $("nextKind").hidden = true; $("nextLeft").textContent = "";
  }
  const nx = nextIndex(S.total);
  [...$("miles").children].forEach((li, j) => {
    const idx = j + 1;
    li.classList.toggle("done", MILESTONES[idx].a <= S.total);
    li.classList.toggle("next", idx === nx);
  });
  $("mCount").textContent = fmt(S.count);
  $("mMax").textContent = S.max ? fmt(S.max) : "–";
  signEls.forEach((s, j) => {
    const ok = MILESTONES[j].a <= S.total;
    s.rect.setAttribute("fill", ok ? "#c6f432" : "#fff04a");
    s.dot.setAttribute("fill", ok ? "#c6f432" : "#fffbe8");
  });
  $("nick").hidden = !S.nick; $("nickName").textContent = S.nick;
}

function checkMilestones(announce) {
  MILESTONES.forEach(m => {
    if (m.a > 0 && m.a <= S.total && !S.seen.has(m.a)) {
      S.seen.add(m.a);
      if (announce) S.queue.push(m);
    }
  });
  store("seen", [...S.seen]);
  showNextPop();
}

function showNextPop() {
  if (S.popOpen || !S.queue.length) return;
  const m = S.queue.shift();
  S.popOpen = true;
  const card = $("popCard");
  card.className = "card" + (m.kind === "trophy" ? " trophy" : "");
  card.innerHTML = `<div class="boom">${m.kind === "task" ? "MÉRFÖLDKŐ!" : "BUMM!"}</div>
    <div class="amt">${m.a >= 1000000 ? "1 000 000" : fmt(m.a)} Ft</div>
    <h2></h2><p></p>`;
  card.querySelector("h2").textContent = m.n;
  card.querySelector("p").textContent = m.t;
  $("pop").hidden = false;
  say(m.kind === "task" ? "Na jó, megcsinálom!" : "Ez az!", 4000);
  setTimeout(() => { $("pop").hidden = true; S.popOpen = false; setTimeout(showNextPop, 500); }, 9000);
}

function bumpTotal() { const t = $("total"); t.classList.remove("bump"); void t.offsetWidth; t.classList.add("bump"); }

function setTotal(n, opts = {}) {
  n = Math.max(0, Math.round(Number(n) || 0));
  const prev = S.total;
  S.total = n;
  S.target = amountToFrac(n);
  if (opts.nickname) S.nick = String(opts.nickname).slice(0, 28);
  if (typeof opts.count === "number") S.count = opts.count;
  if (typeof opts.max === "number") S.max = opts.max;
  if (n > prev && !opts.silent) {
    bumpTotal();
    const diff = n - prev;
    if (opts.count === undefined) { S.count++; S.max = Math.max(S.max, diff); }
    say("+" + fmt(diff) + " Ft" + (opts.name ? " · " + opts.name : ""));
  }
  store("total", S.total); store("nick", S.nick); store("count", S.count); store("max", S.max);
  renderHud();
  checkMilestones(!opts.silent);
}

const progress = {
  setTotal: (n, opts) => setTotal(n, opts),
  add: (amount, opts = {}) => setTotal(S.total + (Number(amount) || 0), opts),
  setNickname: s => { S.nick = String(s || "").slice(0, 28); store("nick", S.nick); renderHud(); if (S.nick) say("Mostantól: " + S.nick, 4000); },
  get total() { return S.total; }
};
window.progress = progress;

window.addEventListener("message", e => {
  const d = e.data; if (!d || typeof d !== "object") return;
  if (d.type === "add") progress.add(d.amount, d);
  else if (d.type === "total") progress.setTotal(d.total, d);
  else if (d.type === "nickname") progress.setNickname(d.nickname);
});

/* ---------- JSON feed ---------- */
const FEED = params.get("feed");
let lastTx = null;
async function poll() {
  try {
    const r = await fetch(FEED, { cache: "no-store" });
    const j = await r.json();
    if (j.nickname && j.nickname !== S.nick) progress.setNickname(j.nickname);
    const tx = j.last && (j.last.id || (j.last.amount + "|" + j.last.name));
    if (typeof j.total === "number" && j.total !== S.total) {
      const isNew = tx && tx !== lastTx;
      setTotal(j.total, Object.assign(isNew ? { name: j.last.name } : {}, typeof j.count === "number" ? { count: j.count, max: j.max } : {}));
    }
    lastTx = tx || lastTx;
  } catch (e) { console.warn("feed:", e); }
  setTimeout(poll, 3000);
}

/* ---------- side quest ranglista ---------- */
const DEMO_BOARD = [
  { name: "Zsófi", points: 31, quests: 9 }, { name: "Bence", points: 27, quests: 8 }, { name: "Márk", points: 22, quests: 7 },
  { name: "Lili", points: 18, quests: 6 }, { name: "Peti", points: 14, quests: 5 }, { name: "Dóri", points: 11, quests: 4 },
  { name: "Gergő", points: 8, quests: 3 }, { name: "Anna", points: 5, quests: 2 }
];
let prevBoard = new Map(), prevLeader = null;
function renderBoard(rows, note) {
  const ol = $("board");
  if (!rows.length) { ol.innerHTML = `<li class="empty">Még senkinek nincs pontja. Az első side quest után itt a neved.</li>`; }
  else {
    ol.innerHTML = rows.map((r, i) => `<li><span class="pos">${i + 1}</span><span class="nm"></span><span class="pt">${Number(r.points)}<small>p</small></span></li>`).join("");
    [...ol.children].forEach((li, i) => {
      const r = rows[i];
      li.querySelector(".nm").textContent = r.name;
      const before = prevBoard.get(r.name);
      if (before !== undefined && before !== Number(r.points)) li.classList.add("up");
    });
    const leader = rows[0].name;
    if (prevLeader && leader !== prevLeader) say("Új első: " + leader + "!", 4500);
    prevLeader = leader;
  }
  prevBoard = new Map(rows.map(r => [r.name, Number(r.points)]));
  $("boardNote").textContent = note || "";
}
async function pollBoard() {
  try {
    const q = `${SUPABASE_URL}/rest/v1/leaderboard?select=*&points=gt.0&order=points.desc,quests.desc&limit=${BOARD_SIZE}`;
    const r = await fetch(q, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    renderBoard((await r.json()).map(x => ({ name: x.name ?? x.player_name ?? "?", points: x.points, quests: x.quests })), "");
  } catch (e) {
    if (!prevBoard.size || !LIVE) renderBoard(LIVE ? [] : DEMO_BOARD, LIVE ? "Kapcsolódás…" : "Példa adatok");
  }
  setTimeout(pollBoard, BOARD_REFRESH_MS);
}

/* ================== animáció ================== */
let last = performance.now(), phase = 0, facing = 1, shownPos = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  // haladás a cél felé
  const gap = S.target - S.pos;
  let vel = 0;
  if (Math.abs(gap) > .0005) {
    const step = Math.sign(gap) * Math.min(Math.abs(gap), .045 * dt);
    S.pos += step; vel = step / dt / .045;
  }
  // üresjárat: ide-oda sétálgat
  const walking = Math.abs(vel) > .1;
  const wander = walking ? 0 : (reduced ? 0 : .007 * Math.sin(t * .5));
  const wanderVel = walking ? 0 : Math.cos(t * .5);
  const disp = Math.max(0, Math.min(1, S.pos + wander));
  shownPos += (disp - shownPos) * Math.min(1, dt * 8);
  const v = walking ? vel : wanderVel * .45;
  if (Math.abs(v) > .05) facing = v > 0 ? 1 : -1;

  // kitöltés
  const fillLen = Math.max(0.001, S.pos * LEN);
  maskPath.setAttribute("stroke-dasharray", `${fillLen} 99999`);

  // figura
  const p = ptAt(shownPos);
  const speed = reduced ? 0 : Math.min(1, Math.abs(v));
  phase += dt * (walking ? 14 : 7) * (speed > .05 ? 1 : 0);
  const swing = Math.sin(phase) * 30 * speed;
  const hop = walking && !reduced ? Math.abs(Math.sin(phase)) * 6 : (reduced ? 0 : Math.sin(t * 2.2) * 1.5);
  runner.setAttribute("transform", `translate(${p.x},${p.y - 14})`);
  body.setAttribute("transform", `translate(0,${-hop}) scale(${facing},1)`);
  legL.setAttribute("transform", `rotate(${swing},0,-34)`);
  legR.setAttribute("transform", `rotate(${-swing},0,-34)`);
  armF.setAttribute("transform", `rotate(${-swing * 1.2},0,-60)`);
  armB.setAttribute("transform", `rotate(${swing * 1.2},0,-60)`);
  head.setAttribute("transform", `rotate(${(walking ? 4 : 0) + Math.sin(t * 1.7) * 2},0,-80)`);
  if (now > bubbleUntil) bubble.setAttribute("opacity", 0);

  // pénzszámláló
  if (S.shown !== S.total) {
    const d = S.total - S.shown;
    S.shown = Math.abs(d) < 1 ? S.total : S.shown + d * Math.min(1, dt * 6);
    $("totalNum").textContent = fmt(S.shown);
  }
  requestAnimationFrame(frame);
}

$("miles").innerHTML = MILESTONES.slice(1).map(m => `<li class="${m.kind || ""}"><b>${m.a >= 1000000 ? "1 M" : fmt(m.a)}</b><span><span class="nm"></span> <span class="tx"></span></span></li>`).join("");
[...$("miles").children].forEach((li, i) => { const m = MILESTONES[i + 1]; li.querySelector(".nm").textContent = m.n; li.querySelector(".tx").textContent = m.short || m.t; });

S.seen = new Set(load("seen", []));
S.nick = load("nick", "");
S.count = load("count", LIVE ? 0 : 9);
S.max = load("max", LIVE ? 0 : 5000);

$("totalNum").textContent = fmt(startTotal);

async function pollQuests() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/completions?select=id`, { method: "HEAD", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, Prefer: "count=exact" }, cache: "no-store" });
    const cr = r.headers.get("content-range"); const n = cr && cr.split("/")[1];
    if (r.ok && n && n !== "*") $("mQuests").textContent = fmt(Number(n));
  } catch (e) { if (!LIVE) $("mQuests").textContent = "47"; }
  setTimeout(pollQuests, 10000);
}
pollQuests();

const demo = $("demo");
demo.hidden = LIVE;
let nickI = 0;
demo.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.add) progress.add(Number(b.dataset.add), { name: ["Peti", "Zsófi", "Bence", "Lili", "Márk"][Math.floor(Math.random() * 5)] });
