<style>
/* Koncepció: éjszakai bár, diszkógömb-csillogás; a questek letéphető italjegyek, a pontok pecsétek. */
:root {
  --night: #170c22;
  --night-2: #221232;
  --night-3: #2e1a42;
  --ink: #f6eefc;
  --ink-dim: #b9a8c9;
  --ink-faint: #7d6a8f;
  --line: #3d2753;
  --coral: #ff5c7a;
  --gold: #ffcb52;
  --mint: #6fe3c4;
  --lv1: #6fe3c4;
  --lv2: #ffcb52;
  --lv3: #ff5c7a;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::after { /* diszkógömb-pöttyök */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.18) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 78% 9%, rgba(255,203,82,.22) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 64% 72%, rgba(111,227,196,.16) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 30% 88%, rgba(255,92,122,.18) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 92% 46%, rgba(255,255,255,.14) 0 1px, transparent 2px);
  background-size: 210px 230px, 260px 190px, 230px 250px, 190px 210px, 170px 170px;
  animation: drift 40s linear infinite;
}
@keyframes drift { to { background-position: 210px 230px, -260px 190px, 230px -250px, -190px -210px, 170px 170px; } }
@media (prefers-reduced-motion: reduce) { body::after { animation: none; } * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

#app {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* fejléc */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px; }
.brand { font: 14px/1 var(--font-display); letter-spacing: .04em; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.brand small { font: 700 11px/1 var(--font-mono); color: var(--ink-faint); letter-spacing: .08em; }
.back { background: none; border: 0; color: var(--ink-dim); font-weight: 700; padding: 8px 0; display: inline-flex; align-items: center; gap: 6px; }
.pill-pts { font: 700 13px/1 var(--font-mono); background: var(--night-3); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; color: var(--gold); white-space: nowrap; }
.demo-flag { font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--night); background: var(--gold); padding: 4px 7px; border-radius: 4px; }

/* gombok */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 15px 22px; font-weight: 800; font-size: 16px; background: var(--coral); color: #1a0710; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.gold { background: var(--gold); color: #261800; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* belépés */
.hero { display: grid; gap: 22px; padding-top: 8px; }
.hero h1 { font: clamp(40px, 13vw, 64px)/.92 var(--font-display); letter-spacing: -.01em; }
.hero h1 span { color: var(--coral); display: block; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; font: 700 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); }
.meta-row span { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; }
.field { display: grid; gap: 8px; }
.field label { font-weight: 700; color: var(--ink-dim); font-size: 14px; }
.field input { width: 100%; font: 600 20px/1.2 var(--font-body); color: var(--ink); background: var(--night-2); border: 1.5px solid var(--line); border-radius: var(--r); padding: 16px; }
.field input::placeholder { color: var(--ink-faint); }
.err { color: var(--coral); font-weight: 700; font-size: 14px; }

/* fotó-keret */
.photo { position: relative; border-radius: var(--r); overflow: hidden; background: var(--night-3); aspect-ratio: 4 / 5; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

<body>
<div id="app" aria-live="polite"></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
(function () {
"use strict";
const C = window.CONFIG, K = window.CONTENT;
const $app = document.getElementById("app");
const $layer = document.getElementById("layer");

/* ---------- segédek ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const questById = id => K.quests.find(q => q.id === id);
const fmtTime = ms => (ms / 1000).toFixed(1).replace(".", ",") + " mp";
const ago = iso => { const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 60) return "most"; if (s < 3600) return Math.floor(s / 60) + " perce"; return Math.floor(s / 3600) + " órája"; };

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function photoHTML(i, cls = "") {
  const list = C.PHOTOS || [];
  const src = list.length ? list[((i % list.length) + list.length) % list.length] : "";
  return `<div class="photo ${cls}"><div class="ph">Ide jön egy kép Ádámról</div>${src ? `<img src="${esc(src)}" alt="Ádám" loading="lazy" onerror="this.remove()">` : ""}</div>`;
}

/* képtömörítés feltöltés előtt */
function compressImage(file, maxSide = 1280, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("blob")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

/* ---------- ADAT: Supabase vagy demó ---------- */
const LIVE = !!(C.SUPABASE_URL && C.SUPABASE_KEY && window.supabase);

const DemoStore = (() => {
  const db = ls.get("bp_demo_db", null) || seed();
  function seed() {
    const names = ["Demó Dóri", "Minta Márk", "Teszt Tomi", "Próba Panni", "Példa Peti", "Kamu Kata"];
    const d = { players: [], completions: [], scores: [] };
    names.forEach((n, i) => {
      const id = "demo-" + i; d.players.push({ id, name: n, level: 1 + (i % 3) });
      shuffle(K.quests.filter(q => q.lv <= 1 + (i % 3))).slice(0, 2 + (i % 4)).forEach((q, k) =>
        d.completions.push({ id: uid(), player_id: id, player_name: n, quest_id: q.id, points: q.pts, photo_url: null, created_at: new Date(Date.now() - (i * 7 + k * 3) * 60000).toISOString() }));
      d.scores.push({ player_id: id, player_name: n, kind: "pyramid", score: 2 + ((i * 3) % 7), time_ms: 40000 + i * 9300 });
    });
    return d;
  }
  const save = () => ls.set("bp_demo_db", db);
  const later = v => new Promise(r => setTimeout(() => r(v), 120));
  return {
    async createPlayer(name) { const p = { id: uid(), name, level: null }; db.players.push(p); save(); return later(p); },
    async setLevel(id, level) { const p = db.players.find(x => x.id === id); if (p) p.level = level; save(); return later(true); },
    async myCompletions(id) { return later(db.completions.filter(c => c.player_id === id)); },
    async complete(me, q, blob) {
      if (db.completions.some(c => c.player_id === me.id && c.quest_id === q.id)) throw new Error("dup");
      let photo_url = null;
      if (blob) photo_url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      const c = { id: uid(), player_id: me.id, player_name: me.name, quest_id: q.id, points: q.pts, photo_url, created_at: new Date().toISOString() };
      db.completions.push(c); save(); return later(c);
    },
    async uncomplete(me, qid) { db.completions = db.completions.filter(c => !(c.player_id === me.id && c.quest_id === qid)); save(); return later(true); },
    async leaderboard(n = 50) {
      const m = new Map(db.players.map(p => [p.id, { player_id: p.id, name: p.name, points: 0, quests: 0 }]));
      db.completions.forEach(c => { const r = m.get(c.player_id); if (r) { r.points += Number(c.points); r.quests++; } });
      return later([...m.values()].filter(r => r.points > 0).sort((a, b) => b.points - a.points || b.quests - a.quests).slice(0, n));
    },
    async feed(n = 12) { return later(db.completions.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n)); },
    async photos(n = 6) { return later(db.completions.filter(c => c.photo_url).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n)); },
    async getScore(id, kind) { return later(db.scores.find(s => s.player_id === id && s.kind === kind) || null); },
    async saveScore(me, kind, score, time_ms) {
      const ex = db.scores.find(s => s.player_id === me.id && s.kind === kind);
      if (ex) Object.assign(ex, { score, time_ms }); else db.scores.push({ player_id: me.id, player_name: me.name, kind, score, time_ms });
      save(); return later(true);
    },
    async scoreBoard(kind, n = 20) { return later(db.scores.filter(s => s.kind === kind).sort((a, b) => b.score - a.score || a.time_ms - b.time_ms).slice(0, n)); },
    reset() { ls.del("bp_demo_db"); }
  };
})();

const SupaStore = (() => {
  if (!LIVE) return null;
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { persistSession: false } });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async createPlayer(name) { return ok(await sb.from("players").insert({ name }).select().single()); },
    async setLevel(id, level) { ok(await sb.from("players").update({ level }).eq("id", id)); return true; },
    async myCompletions(id) { return ok(await sb.from("completions").select("*").eq("player_id", id)); },
    async complete(me, q, blob) {
      let photo_url = null;
      if (blob) {
        const path = `${me.id}/${q.id}-${Date.now()}.jpg`;
        ok(await sb.storage.from("proofs").upload(path, blob, { contentType: "image/jpeg", upsert: false }));
        photo_url = sb.storage.from("proofs").getPublicUrl(path).data.publicUrl;
      }
      return ok(await sb.from("completions").insert({ player_id: me.id, player_name: me.name, quest_id: q.id, points: q.pts, photo_url }).select().single());
    },
    async uncomplete(me, qid) { ok(await sb.from("completions").delete().eq("player_id", me.id).eq("quest_id", qid)); return true; },
    async leaderboard(n = 50) { return ok(await sb.from("leaderboard").select("*").gt("points", 0).order("points", { ascending: false }).order("quests", { ascending: false }).limit(n)); },
    async feed(n = 12) { return ok(await sb.from("completions").select("player_name,quest_id,points,photo_url,created_at").order("created_at", { ascending: false }).limit(n)); },
    async photos(n = 6) { return ok(await sb.from("completions").select("player_name,quest_id,photo_url,created_at").not("photo_url", "is", null).order("created_at", { ascending: false }).limit(n)); },
    async getScore(id, kind) { return ok(await sb.from("scores").select("*").eq("player_id", id).eq("kind", kind).maybeSingle()); },
    async saveScore(me, kind, score, time_ms) { ok(await sb.from("scores").upsert({ player_id: me.id, player_name: me.name, kind, score, time_ms }, { onConflict: "player_id,kind" })); return true; },
    async scoreBoard(kind, n = 20) { return ok(await sb.from("scores").select("*").eq("kind", kind).order("score", { ascending: false }).order("time_ms", { ascending: true }).limit(n)); }
  };
})();

const store = SupaStore || DemoStore;

/* ---------- állapot ---------- */
const S = {
  me: ls.get("bp_me", null),          // {id, name, level}
  done: new Map(),                    // quest_id -> completion
  board: [],
  view: "home",
  questLevel: null,
  busy: false
};
const myPoints = () => [...S.done.values()].reduce((s, c) => s + Number(c.points), 0);
function maxUnlocked() {
  if (!S.me || !S.me.level) return 0;
  let L = S.me.level;
  while (L < 3 && K.quests.some(q => q.lv === L && S.done.has(q.id))) L++;
  return L;
}
function myRank() { const i = S.board.findIndex(r => r.player_id === S.me?.id); return i >= 0 ? i + 1 : null; }

async function refreshMine() {
  if (!S.me) return;
  try { const rows = await store.myCompletions(S.me.id); S.done = new Map(rows.map(r => [r.quest_id, r])); } catch (e) { console.warn(e); }
}
async function refreshBoard() { try { S.board = await store.leaderboard(50); } catch (e) { console.warn(e); } }

/* ---------- router ---------- */
function go(view, opts = {}) { S.view = view; Object.assign(S, opts); render(); window.scrollTo(0, 0); }

function header(back = true) {
  return `<header class="top">
    ${back ? `<button class="back" data-go="home" aria-label="Vissza a főoldalra">← Főoldal</button>` : `<div class="brand">ÁDÁM <small>NOV 7 · PACSI</small></div>`}
    <div style="display:flex;gap:8px;align-items:center">${LIVE ? "" : `<span class="demo-flag" title="Nincs bekötve a közös adatbázis">Demó</span>`}<span class="pill-pts">${myPoints()} pont</span></div>
  </header>`;
}

function render() {
  if (!S.me) return renderJoin();
  const v = S.view;
  if (v === "home") return renderHome();
  if (v === "intake") return renderIntake();
  if (v === "quests") return renderQuests();
  if (v === "adamquiz") return renderAdamQuiz();
  if (v === "topics") return renderTopics();
  if (v === "pyramid") return renderPyramid();
  renderHome();
}

/* ---------- belépés ---------- */
function renderJoin(err = "") {
  const urlCode = new URLSearchParams(location.search).get("kod") || "";
  const needCode = !!C.PARTY_CODE && urlCode.toUpperCase() !== C.PARTY_CODE.toUpperCase();
  $app.innerHTML = `
    <header class="top"><div class="brand">ÁDÁM <small>NOV 7 · PACSI</small></div>${LIVE ? "" : `<span class="demo-flag">Demó</span>`}</header>
    <section class="hero">
      <div class="strip">${photoHTML(0)}${photoHTML(1)}${photoHTML(2)}</div>
      <h1>Szülinapi<span>side questek</span></h1>
      <div class="meta-row"><span>2026. nov. 7.</span><span>Pacsi, alsó szint</span><span>19:00-tól</span></div>
      <form id="join" class="hero" style="gap:14px" autocomplete="off">
        <div class="field"><label for="nm">Hogy hívnak?</label><input id="nm" name="nm" maxlength="24" placeholder="Pl. Kovács Márk" required></div>
        ${needCode ? `<div class="field"><label for="code">Buli-kód</label><input id="code" name="code" maxlength="20" placeholder="A meghívóban vagy a falon"></div>` : ""}
        ${err ? `<p class="err">${esc(err)}</p>` : ""}
        <button class="btn block" type="submit" id="joinbtn">Beszállok</button>
      </form>
    </section>`;
  document.getElementById("join").addEventListener("submit", async ev => {
    ev.preventDefault();

}

      <button class="tile" data-go="pyramid"><span class="k">9 szint · 1 esély</span><div style="display:grid;gap:6px"><h2>Kvíz&shy;piramis</h2><p>Egyre nehezebb. Egy hiba, és lezuhansz.</p></div></button>
      <button class="tile" data-go="topics" style="grid-column:1/-1"><span class="k">Dilemmák · jégtörők</span><div style="display:grid;gap:6px"><h2>Témadobó</h2><p>Ha elakadt a beszélgetés: két oldal, két ember, két perc vita.</p></div></button>

    <section class="section">
      <h3>Side quest ranglista</h3>

}
function boardRow(r, i, val) {
  return `<div class="row ${r.player_id === S.me?.id ? "me" : ""}"><span class="pos">${i + 1}.</span><span class="nm">${esc(r.name ?? r.player_name)}</span><span class="val">${val ?? (Number(r.points) + " p")}</span></div>`;
}

/* ---------- besoroló kérdések ---------- */
let intakeState = null;
function renderIntake() {
  if (!intakeState) intakeState = { i: 0, sum: 0 };
  const st = intakeState;
  if (st.i >= K.intake.length) {
    const max = K.intake.length * 2, ratio = st.sum / max;
    const lv = ratio < 0.34 ? 1 : ratio < 0.7 ? 2 : 3;
    const L = K.levels[lv - 1];
    $app.innerHTML = `${header()}<section class="verdict">
      <span class="step">A szinted</span>
      <div class="lvl-badge" style="color:var(${L.color})">${esc(L.name)}</div>
      <p>${lv === 1 ? "Kezdjük lazán. Egy teljesített quest után megnyílik a Bátor szint is." : lv === 2 ? "Van benned kurázsi. Teljesíts egyet, és jöhet a Legenda szint." : "Neked nincsenek határaid. Minden szint nyitva."} A könnyebb questek mindig elérhetők.</p>
      <button class="btn block" data-act="setlevel" data-lv="${lv}">Mutasd a questeket</button>
    </section>`;
    return;
  }
  const item = K.intake[st.i];
  $app.innerHTML = `${header()}<section class="intake">
    <span class="step">${st.i + 1} / ${K.intake.length}</span>
    <h2>${esc(item.q)}</h2>
    <div class="choices">${item.a.map(([t, p]) => `<button class="choice" data-act="intake" data-p="${p}">${esc(t)}</button>`).join("")}</div>
  </section>`;
}

/* ---------- questek ---------- */
function renderQuests() {
  const unlocked = maxUnlocked();
  const lv = S.questLevel && S.questLevel <= 3 ? S.questLevel : Math.min(S.me.level, 3);
  const L = K.levels[lv - 1];
  const isLocked = lv > unlocked;
  const list = K.quests.filter(q => q.lv === lv);
  const tabs = K.levels.map(l => {
    const cnt = K.quests.filter(q => q.lv === l.n && S.done.has(q.id)).length;
    const tot = K.quests.filter(q => q.lv === l.n).length;
    return `<button class="lv-tab ${l.n === lv ? "on" : ""} ${l.n > unlocked ? "locked" : ""}" style="--c:var(${l.color})" data-act="lvtab" data-lv="${l.n}">
      <b>${esc(l.name)}</b><small>${l.n > unlocked ? "zárva" : cnt + "/" + tot}</small></button>`;
  }).join("");
  let body;
  if (isLocked) {
    const prev = K.levels[lv - 2];
    body = `<div class="locked-box"><span class="lock-ic">?</span><b>${list.length} quest vár itt</b>
      <p>Teljesíts legalább egyet a(z) ${esc(prev.name)} szinten, és megnyílik.</p>
      <button class="btn ghost" data-act="lvtab" data-lv="${unlocked}">Vissza a ${esc(K.levels[unlocked - 1].name)} szintre</button></div>`;
  } else {
    body = `<div class="quests">${list.map(q => ticketHTML(q, L)).join("")}</div>`;
  }
  $app.innerHTML = `${header()}
    <div class="lv-tabs">${tabs}</div>
    <div class="lv-head" style="--c:var(${L.color})"><h2>${esc(L.name)}</h2><p>${esc(L.short)}</p></div>
    ${body}
    <p style="margin-top:22px;font-size:13px;color:var(--ink-faint);text-align:center">Becsületkassza: azt pipáld ki, amit tényleg megcsináltál.</p>`;
}
function ticketHTML(q, L) {
  const d = S.done.get(q.id);
  const riddle = q.riddle ? `<div class="riddle">„${esc(pick(K.riddles))}”</div>` : "";
  return `<article class="ticket ${d ? "done" : ""}" style="--c:var(${L.color})">
    <div class="body">
      <p class="txt">${esc(q.t)}</p>
      ${q.note ? `<p class="note">${esc(q.note)}</p>` : ""}
      ${riddle}
      ${q.photo ? `<div class="tags"><span class="tag cam">Fotó kötelező</span></div>` : ""}
      ${d && d.photo_url ? `<img class="proof" src="${esc(d.photo_url)}" alt="Bizonyíték">` : ""}
    </div>
    <div class="stub"><span class="p">${d ? "✓" : q.pts}</span><span class="u">${d ? "+" + q.pts + " p" : "pont"}</span></div>
        <div class="act">${d
      ? `<button data-act="undo" data-q="${q.id}">Mégsem csináltam meg</button>`
      : `<button data-act="done" data-q="${q.id}">${q.photo ? "Megvan, feltöltöm a fotót" : "Megcsináltam"}</button>`}</div>
  </article>`;
}

function openSheet(html, onMount) {
  $layer.innerHTML = `<div class="scrim" data-act="close-scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  onMount && onMount($layer.querySelector(".sheet"));
}
function closeSheet() { $layer.innerHTML = ""; }

function confirmQuest(q) {
  let blob = null;
  openSheet(`
    <h2>${q.photo ? "Mutasd a bizonyítékot" : "Tényleg megvan?"}</h2>
    <p>${esc(q.t)}</p>
    <label class="upload" id="up"><input type="file" id="file" accept="image/*" ${q.photo ? "" : ""}>
      <span id="upmsg">${q.photo ? "Koppints ide, és fotózz vagy válassz képet" : "Fotó opcionális, de a kivetítőn jól mutat"}</span></label>
    <div class="row-btns"><button class="btn ghost" data-act="close">Mégse</button><button class="btn" id="ok" ${q.photo ? "disabled" : ""}>+${q.pts} pont</button></div>`,
  sheet => {
    const file = sheet.querySelector("#file"), ok = sheet.querySelector("#ok"), up = sheet.querySelector("#upmsg");
    file.addEventListener("change", async () => {
      const f = file.files[0]; if (!f) return;
      up.textContent = "Kép előkészítése…";
      try {
        blob = await compressImage(f);
        const u = URL.createObjectURL(blob);
        up.innerHTML = `<img src="${u}" alt="Előnézet">`;
        ok.disabled = false;
      } catch (e) { up.textContent = "Ezt a képet nem tudtam megnyitni. Próbálj egy másikat."; }
    });
    ok.addEventListener("click", async () => {
      if (S.busy) return; S.busy = true; ok.disabled = true; ok.textContent = "Mentés…";
      try {
        const before = maxUnlocked();
        const c = await store.complete(S.me, q, blob);
        S.done.set(q.id, c); closeSheet();
        const after = maxUnlocked();
        toast(after > before ? `+${q.pts} pont! Megnyílt: ${K.levels[after - 1].name}` : `+${q.pts} pont!`);
        refreshBoard(); render();
      } catch (e) {
        console.error(e);
        if (String(e.message).includes("dup") || e.code === "23505") { toast("Ezt már kipipáltad."); closeSheet(); await refreshMine(); render(); }
        else { ok.disabled = false; ok.textContent = "Újrapróbálom"; toast("Nem sikerült menteni. Próbáld újra."); }
      } finally { S.busy = false; }
    });
  });
}

/* ---------- Ádám-kvíz ---------- */
let aq = null;
async function renderAdamQuiz() {
  if (!aq) {
    $app.innerHTML = `${header()}<p class="empty">Betöltés…</p>`;
    const prev = await store.getScore(S.me.id, "adam").catch(() => null);
    aq = { i: 0, score: 0, answered: null, marks: [], prev };
  }
  const st = aq, Q = K.adamQuiz;
  if (st.i >= Q.length) {
    if (!st.saved) { st.saved = true; if (!st.prev) store.saveScore(S.me, "adam", st.score, 0).catch(console.warn); }
    const msg = st.score === Q.length ? "Ez már gyanús. Te vagy Ádám?" : st.score >= Q.length - 1 ? "Közeli barát vagy, vagy nagyon figyelsz." : st.score >= 2 ? "Van mit pótolni. Menj oda hozzá, és kérdezd ki." : "Most ismerted meg? Itt az ideje bemutatkozni.";
    $app.innerHTML = `${header()}<section class="result">
      <span class="step">Ki ez az Ádám?</span>
      <div class="score">${st.score}/${Q.length}</div>
      <p>${esc(msg)}</p>
      ${photoHTML(7, "wide")}
      <div class="btn-row" style="width:100%"><button class="btn ghost" data-act="aq-again">Újra</button><button class="btn" data-go="home">Főoldal</button></div>
    </section>`;
    return;
  }
  const item = Q[st.i], ans = st.answered;
  $app.innerHTML = `${header()}<section class="quiz">
    <div class="qhead"><span>Ki ez az Ádám? · ${st.i + 1}/${Q.length}</span><span class="dots">${Q.map((_, k) => `<i class="${st.marks[k] === true ? "ok" : st.marks[k] === false ? "bad" : k === st.i ? "cur" : ""}"></i>`).join("")}</span></div>
    ${photoHTML(item.photo ?? st.i, "wide")}
    <h2>${esc(item.q)}</h2>
    <div class="choices">${item.a.map((t, k) => {
      const cls = ans === null ? "" : k === item.c ? "right" : k === ans ? "wrong" : "";
      return `<button class="opt ${cls}" data-act="aq" data-k="${k}" ${ans !== null ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span>${esc(t)}</button>`;
    }).join("")}</div>
    ${ans !== null ? `<div class="info"><b>${ans === item.c ? "Talált" : "Nem egészen"}</b>${esc(item.info)}</div><button class="btn block" data-act="aq-next">${st.i + 1 < Q.length ? "Következő" : "Eredmény"}</button>` : ""}
  </section>`;
}

/* ---------- Témadobó ---------- */
const T = { tab: "coin", d: null, assign: null, ice: null, timerEnd: 0, timerId: null };
function renderTopics() {
  if (!T.d) T.d = pick(K.dilemmas);
  if (!T.ice) T.ice = pick(K.icebreakers);
  let body;
  if (T.tab === "coin") {
    const left = T.timerEnd ? Math.max(0, T.timerEnd - Date.now()) : 120000;
    const mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
    body = `<section class="dilemma">
      <span class="topic">${esc(T.d.q)}</span>
      <div class="coin">
        <div class="side a"><span class="who">${T.assign ? esc(T.assign[0]) : "Egyik oldal"}</span><span class="what">${esc(T.d.a)}</span></div>
        <span class="vs">VS</span>
        <div class="side b"><span class="who">${T.assign ? esc(T.assign[1]) : "Másik oldal"}</span><span class="what">${esc(T.d.b)}</span></div>
      </div>
      <div class="rules"><b>Az érem két oldala.</b> Ketten játsszátok. Mindenki megkapja az egyik oldalt, és két percig azt védi, akkor is, ha valójában egyetért a másikkal. A végén a nézők döntenek, ki győzött.</div>
      <div class="timer ${left < 20000 && T.timerEnd ? "hot" : ""}" id="timer">${mm}:${String(ss).padStart(2, "0")}</div>
      <div class="btn-row">
        <button class="btn ghost" data-act="flip">${T.assign ? "Újrasorsol" : "Ki melyik oldal?"}</button>
        <button class="btn gold" data-act="timer">${T.timerEnd ? "Leállít" : "2 perc indul"}</button>
      </div>
      <button class="btn block" data-act="newd">Új dilemma</button>
    </section>`;
  } else {
    body = `<section class="dilemma">
      <div class="ice"><small>Kérdezd meg tőle</small><q>${esc(T.ice)}</q><small>Tipp: a válasz után kérdezz vissza egy „és miért?”-tel</small></div>
      <button class="btn block" data-act="newice">Másikat kérek</button>
    </section>`;
  }
  $app.innerHTML = `${header()}
    <div class="seg"><button class="${T.tab === "coin" ? "on" : ""}" data-act="ttab" data-t="coin">Érem két oldala</button><button class="${T.tab === "ice" ? "on" : ""}" data-act="ttab" data-t="ice">Jégtörők</button></div>
    ${body}`;
}
function tickTimer() {
  const el = document.getElementById("timer");
  if (!T.timerEnd) return;
  const left = Math.max(0, T.timerEnd - Date.now());
  if (el) { const mm = Math.floor(left / 60000), ss = Math.ceil((left % 60000) / 1000) % 60; el.textContent = `${mm}:${String(left > 0 && ss === 0 && left % 60000 > 0 ? 0 : ss).padStart(2, "0")}`; el.classList.toggle("hot", left < 20000); }
  if (left <= 0) { clearInterval(T.timerId); T.timerId = null; T.timerEnd = 0; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); toast("Lejárt az idő! Ki győzött?"); if (S.view === "topics") renderTopics(); }
}

/* ---------- Kvízpiramis ---------- */
let P = null;
async function renderPyramid() {
  if (!P) {
    $app.innerHTML = `${header()}<p class="empty">Betöltés…</p>`;
    const [mine, board] = await Promise.all([store.getScore(S.me.id, "pyramid").catch(() => null), store.scoreBoard("pyramid", 20).catch(() => [])]);
    P = { phase: mine ? "done" : "intro", mine, board, lvl: 0, qs: null, start: 0, qStart: 0, ans: null, timer: null };
  }
  const levels = K.pyramid.length;
  const pyr = (cur, fell) => `<div class="pyr" aria-hidden="true">${K.pyramid.map((_, k) => { const lv = levels - 1 - k; const w = 34 + (levels - 1 - lv) * 0 + (lv === levels - 1 ? 0 : 0); return `<i style="width:${30 + (levels - lv) * 7.5}%" class="${lv < cur ? "done" : lv === cur ? (fell ? "fell" : "cur") : ""}">${lv + 1}</i>`; }).join("")}</div>`;

  if (P.phase === "intro") {
    $app.innerHTML = `${header()}<section class="pyr-intro">
      <h1>Kvízpiramis</h1>
      ${pyr(-1)}
      <ul><li>9 szint, mindegyik nehezebb az előzőnél.</li><li>Kérdésenként ${K.pyramidSeconds} másodperc.</li><li>Egy rossz válasz vagy lejárt idő, és lezuhansz.</li><li><b style="color:var(--gold)">Csak egy próbálkozásod van.</b> Holtversenynél a gyorsabb nyer.</li></ul>
      <button class="btn block gold" data-act="pstart">Indulás a csúcsra</button>
      ${pBoard()}
    </section>`;
    return;
  }
  if (P.phase === "play") {
    const q = P.qs[P.lvl], ans = P.ans;
    $app.innerHTML = `${header()}<section class="quiz">
      <div class="qhead"><span>${P.lvl + 1}. szint / ${levels}</span><span id="ptime">${K.pyramidSeconds} mp</span></div>
      ${pyr(P.lvl, ans !== null && ans !== q.c)}
      <div class="tbar"><div id="pbar"></div></div>
      <h2>${esc(q.q)}</h2>
      <div class="choices">${q.a.map((t, k) => { const cls = ans === null ? "" : k === q.c ? "right" : k === ans ? "wrong" : ""; return `<button class="opt ${cls}" data-act="pans" data-k="${k}" ${ans !== null ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span>${esc(t)}</button>`; }).join("")}</div>
    </section>`;
    if (ans === null) runPTimer();
    return;
  }
  // done
  const m = P.mine;
  const top = m.score >= levels;
  $app.innerHTML = `${header()}<section class="result">
    <span class="step">Kvízpiramis</span>
    <div class="score">${m.score}/${levels}</div>
    <p>${top ? "A csúcson vagy. Ezt kevesen mondhatják el." : m.score === 0 ? "Az első lépcsőnél csúsztál el. Előfordul a legjobbakkal is." : `A ${m.score}. szintig jutottál, ${fmtTime(m.time_ms)} alatt.`}</p>
    ${pyr(m.score, !top)}
    ${pBoard()}
    <button class="btn block ghost" data-go="home">Főoldal</button>
  </section>`;
}
function pBoard() {
  const b = P.board || [];
  return `<div class="section" style="width:100%;text-align:left"><h3>Örökranglista</h3>${b.length ? `<div class="board">${b.slice(0, 10).map((r, i) => boardRow({ ...r, name: r.player_name }, i, `${r.score} · ${fmtTime(r.time_ms)}`)).join("")}</div>` : `<div class="empty">Még senki nem mászott.</div>`}</div>`;
}
function runPTimer() {
  clearInterval(P.timer);
  P.qStart = Date.now();
  const total = K.pyramidSeconds * 1000;
  P.timer = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - P.qStart));
    const bar = document.getElementById("pbar"), lab = document.getElementById("ptime");
    if (bar) bar.style.transform = `scaleX(${left / total})`;
    if (lab) lab.textContent = Math.ceil(left / 1000) + " mp";
    if (left <= 0) { clearInterval(P.timer); pAnswer(-1); }
  }, 100);
}
async function pAnswer(k) {
  if (!P || P.phase !== "play" || P.ans !== null) return;
  clearInterval(P.timer);
  const q = P.qs[P.lvl];
  P.ans = k;
  const right = k === q.c;
  renderPyramid();
  if (k === -1) toast("Lejárt az idő!");
  const elapsed = Date.now() - P.start;
  const reached = right ? P.lvl + 1 : P.lvl;
  await store.saveScore(S.me, "pyramid", reached, elapsed).catch(console.warn);
  setTimeout(async () => {
    if (right && P.lvl + 1 < K.pyramid.length) { P.lvl++; P.ans = null; renderPyramid(); return; }
    P.mine = { score: reached, time_ms: elapsed };
    P.board = await store.scoreBoard("pyramid", 20).catch(() => P.board);
    P.phase = "done"; renderPyramid();
  }, right ? 900 : 1800);
}

/* ---------- felugró ablakok ---------- */
let popTimer = null;
function schedulePopup() {
  clearTimeout(popTimer);
  if (!S.me || document.body.classList.contains("tv")) return;
  const base = (C.POPUP_MINUTES || 4) * 60000;
  popTimer = setTimeout(showPopup, base * (0.75 + Math.random() * 0.6));
}
function showPopup() {
  const busy = $layer.innerHTML || (S.view === "pyramid" && P && P.phase === "play") || document.hidden;
  if (busy) { popTimer = setTimeout(showPopup, 45000); return; }
  openSheet(`<div class="pop" style="display:grid;gap:14px">
    ${photoHTML(Math.floor(Math.random() * 99))}
    <h2>${esc(pick(["Egy pillanat!", "Hé, te ott!", "Üzenet a szülinapostól", "Kis emlékeztető"]))}</h2>
    <p style="color:var(--ink);font-size:18px;font-weight:600">${esc(pick(K.popups))}</p>
    <button class="btn block" data-act="close">Megyek!</button></div>`);
  schedulePopup();
}

/* ---------- események ---------- */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-go],[data-act]");
  if (!el) return;
  if (el.dataset.act === "close-scrim") { if (ev.target === el) closeSheet(); return; }
  if (el.dataset.go) {
    const v = el.dataset.go;
    if (v === "adamquiz") aq = null;
    if (v === "pyramid") { if (P && P.timer) clearInterval(P.timer); P = null; }
    if (v === "intake") intakeState = null;
    if (v === "home") { refreshBoard().then(() => { if (S.view === "home") renderHome(); }); }
    go(v); return;
  }
  const a = el.dataset.act;
  if (a === "close") return closeSheet();
  if (a === "logout") {
    openSheet(`<h2>Kilépsz?</h2><p>A pontjaid megmaradnak ${esc(S.me.name)} néven, de erről a telefonról új névvel kell belépned.</p>
      <div class="row-btns"><button class="btn ghost" data-act="close">Maradok</button><button class="btn" data-act="logout-yes">Kilépek</button></div>`);
    return;
  }
  if (a === "logout-yes") { closeSheet(); ls.del("bp_me"); S.me = null; S.done = new Map(); render(); return; }
  if (a === "intake") { intakeState.sum += Number(el.dataset.p); intakeState.i++; renderIntake(); return; }
  if (a === "setlevel") {
    const lv = Number(el.dataset.lv); S.me.level = lv; ls.set("bp_me", S.me);
    store.setLevel(S.me.id, lv).catch(console.warn);
    intakeState = null; go("quests", { questLevel: lv }); return;
  }
  if (a === "lvtab") { S.questLevel = Number(el.dataset.lv); renderQuests(); return; }
  if (a === "done") { const q = questById(el.dataset.q); if (q) confirmQuest(q); return; }
  if (a === "undo") {
    const q = questById(el.dataset.q);
    openSheet(`<h2>Visszavonod?</h2><p>${esc(q.t)}</p><div class="row-btns"><button class="btn ghost" data-act="close">Mégse</button><button class="btn" data-act="undo-yes" data-q="${q.id}">Visszavonom</button></div>`);
    return;
  }
  if (a === "undo-yes") {
    const id = el.dataset.q;
    try { await store.uncomplete(S.me, id); S.done.delete(id); closeSheet(); toast("Visszavonva."); refreshBoard(); render(); }
    catch (e) { toast("Nem sikerült. Próbáld újra."); }
    return;
  }
  if (a === "aq") { if (aq.answered !== null) return; const k = Number(el.dataset.k); aq.answered = k; const ok = k === K.adamQuiz[aq.i].c; aq.marks[aq.i] = ok; if (ok) aq.score++; renderAdamQuiz(); return; }
  if (a === "aq-next") { aq.i++; aq.answered = null; renderAdamQuiz(); window.scrollTo(0, 0); return; }
  if (a === "aq-again") { aq = { i: 0, score: 0, answered: null, marks: [], prev: true }; renderAdamQuiz(); return; }
  if (a === "ttab") { T.tab = el.dataset.t; renderTopics(); return; }
  if (a === "newd") { let n; do { n = pick(K.dilemmas); } while (n === T.d && K.dilemmas.length > 1); T.d = n; T.assign = null; renderTopics(); return; }
  if (a === "newice") { let n; do { n = pick(K.icebreakers); } while (n === T.ice && K.icebreakers.length > 1); T.ice = n; renderTopics(); return; }
  if (a === "flip") { T.assign = Math.random() < 0.5 ? ["Te védd ezt", "A másik ezt"] : ["A másik ezt", "Te védd ezt"]; renderTopics(); return; }
  if (a === "timer") {
    if (T.timerEnd) { T.timerEnd = 0; clearInterval(T.timerId); T.timerId = null; }
    else { T.timerEnd = Date.now() + 120000; clearInterval(T.timerId); T.timerId = setInterval(tickTimer, 250); }
    renderTopics(); return;
  }
  if (a === "pstart") {
    P.qs = K.pyramid.map(pair => { const q = pick(pair); const order = shuffle([0, 1, 2, 3]); return { q: q.q, a: order.map(i => q.a[i]), c: order.indexOf(q.c) }; });
    P.phase = "play"; P.lvl = 0; P.ans = null; P.start = Date.now();
    await store.saveScore(S.me, "pyramid", 0, 0).catch(console.warn); // a próbálkozás elindult
    renderPyramid(); return;
  }
  if (a === "pans") { pAnswer(Number(el.dataset.k)); return; }
});

/* ===================== KIVETÍTŐS NÉZET (#tv) ===================== */
async function renderTV() {
  document.body.classList.add("tv");
  $app.innerHTML = `<div class="tvgrid">
    <div class="tvtitle"><h1>ÁDÁM <span>SIDE QUEST</span></h1><div class="meta-row"><span>2026. nov. 7.</span><span>Pacsi</span>${LIVE ? "" : "<span>Demó</span>"}</div></div>
    <div class="tvcol"><h3>Ranglista</h3><div class="board" id="tvboard"></div></div>
    <div class="tvcol"><h3>Kvízpiramis csúcsai</h3><div class="board" id="tvpyr"></div><h3 style="margin-top:10px">Most történt</h3><div class="feed" id="tvfeed"></div></div>
    <div class="tvcol"><div class="qrbox"><b>Szállj be te is</b><div id="qr"></div></div><h3>Bizonyítékok</h3><div class="wall" id="tvwall"></div></div>
  </div>`;
  try { if (window.QRCode) new QRCode(document.getElementById("qr"), { text: C.APP_URL || (location.origin + location.pathname), width: 220, height: 220, colorDark: "#170c22", colorLight: "#f6eefc" }); } catch (e) {}
  const tick = async () => {
    try {
      const [board, pyr, feed, pics] = await Promise.all([store.leaderboard(10), store.scoreBoard("pyramid", 5), store.feed(6), store.photos(4)]);
      document.getElementById("tvboard").innerHTML = board.length ? board.map((r, i) => boardRow(r, i)).join("") : `<div class="empty">Még üres. Olvasd be a QR-kódot!</div>`;
      document.getElementById("tvpyr").innerHTML = pyr.length ? pyr.map((r, i) => boardRow({ ...r, name: r.player_name }, i, `${r.score}/9`)).join("") : `<div class="empty">Még senki nem mászott.</div>`;
      document.getElementById("tvfeed").innerHTML = feed.map(c => { const q = questById(c.quest_id); return `<div><b>${esc(c.player_name)}</b> +${c.points} p · ${esc(q ? q.t : "")}<small>${ago(c.created_at)}</small></div>`; }).join("") || `<div class="empty">Itt jelennek meg a teljesített questek.</div>`;
      document.getElementById("tvwall").innerHTML = pics.map(c => `<figure><img src="${esc(c.photo_url)}" alt=""><figcaption>${esc(c.player_name)}</figcaption></figure>`).join("") || `<div class="empty" style="grid-column:1/-1">A Legenda-szint fotói ide kerülnek.</div>`;
    } catch (e) { console.warn(e); }
  };
  await tick(); setInterval(tick, 8000);
}

/* ---------- indulás ---------- */
async function boot() {
  if (location.hash === "#tv") return renderTV();
  if (location.hash === "#demo-reset" && !LIVE) { DemoStore.reset(); ls.del("bp_me"); location.hash = ""; location.reload(); return; }
  if (S.me) { $app.innerHTML = `<p class="empty" style="margin-top:40px">Betöltés…</p>`; await Promise.all([refreshMine(), refreshBoard()]); schedulePopup(); }
  render();
  setInterval(() => { if (S.me && S.view === "home" && !$layer.innerHTML) refreshBoard().then(() => { if (S.view === "home" && !$layer.innerHTML) renderHome(); }); }, 20000);
}
window.addEventListener("hashchange", () => location.reload());
boot();
})();
</script>
