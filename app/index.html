.toast { position: fixed; left: 50%; transform: translateX(-50%) rotate(-1deg); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--c-lemon); color: var(--c-black); font: 22px/1 var(--font-display); letter-spacing: .04em; border: var(--bd); border-radius: 4px; padding: 11px 16px 8px; box-shadow: var(--sh); animation: rise .2s ease-out; max-width: calc(100% - 32px); text-align: center; }

/* kvíz */
.quiz { display: grid; gap: 16px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 800 12px/1 var(--font-body); letter-spacing: .12em; color: var(--c-lime); text-transform: uppercase; }
.dots { display: flex; gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 2px; background: var(--night-3); border: 2px solid var(--c-paper); }
.dots i.ok { background: var(--c-lime); } .dots i.bad { background: var(--c-pop); } .dots i.cur { background: var(--c-lemon); }
.quiz h2 { font: 900 24px/1.25 var(--font-body); color: var(--c-paper); }
.opt { text-align: left; padding: 13px 14px; border-radius: var(--r); border: var(--bd); background: var(--c-paper); color: var(--c-black); box-shadow: var(--sh); font-weight: 800; display: flex; gap: 12px; align-items: center; transition: transform .08s, box-shadow .08s; }
.opt:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--c-black); }
.opt .l { font: 20px/1 var(--font-display); width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: var(--c-black); color: var(--c-lemon); border-radius: 3px; padding-top: 2px; }
.opt.right { background: var(--c-lime); }
.opt.wrong { background: var(--c-pop); color: var(--c-paper); }
.opt.wrong .l { color: var(--c-pop); }
.opt[disabled] { cursor: default; }
.info { background: var(--c-lemon); color: var(--c-black); border: var(--bd); border-radius: var(--r); box-shadow: var(--sh); padding: 14px 16px; font-size: 15px; font-weight: 600; display: grid; gap: 6px; }
.info b { font: 26px/1 var(--font-display); letter-spacing: .03em; font-weight: 400; }
.result { display: grid; gap: 16px; justify-items: center; text-align: center; padding-top: 10px; }
.result .score { font: 120px/.9 var(--font-display); color: var(--c-lemon); -webkit-text-stroke: 3px var(--c-black); text-shadow: 6px 6px 0 var(--c-black); paint-order: stroke fill; transform: rotate(-3deg); }
.result p { color: var(--ink-dim); max-width: 34ch; font-weight: 600; }
.result .photo { width: 100%; }

/* témadobó */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.seg button { border: var(--bd); background: var(--c-paper); color: var(--c-black); border-radius: 4px; padding: 10px 8px 7px; font: 20px/1 var(--font-display); letter-spacing: .04em; box-shadow: 3px 3px 0 var(--c-black); }
.seg button.on { background: var(--c-lemon); transform: translateY(-2px); box-shadow: 5px 5px 0 var(--c-black); }
.dilemma { display: grid; gap: 16px; }
.dilemma .topic { font: 34px/1 var(--font-display); letter-spacing: .03em; text-align: center; color: var(--c-paper); text-shadow: 3px 3px 0 var(--c-black); }
.coin { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 8px; }
.side { border-radius: var(--r); padding: 14px 12px; display: grid; gap: 8px; align-content: start; min-height: 150px; border: 4px solid var(--c-black); box-shadow: var(--sh); color: var(--c-black); }
.side.a { background: var(--c-pop); transform: rotate(-1.5deg); }
.side.b { background: var(--c-lime); transform: rotate(1.5deg); }
.side .who { font: 800 10px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; }
.side .what { font: 900 18px/1.2 var(--font-body); }
.vs { align-self: center; font: 32px/1 var(--font-display); color: var(--c-lemon); -webkit-text-stroke: 1.5px var(--c-black); text-shadow: 3px 3px 0 var(--c-black); }
.rules { font-size: 14px; font-weight: 600; color: #3d3846; background: var(--c-paper); border: var(--bd); border-radius: var(--r); padding: 14px 16px; }
.rules b { color: var(--c-black); }
.timer { font: 96px/1 var(--font-display); text-align: center; font-variant-numeric: tabular-nums; color: var(--c-paper); -webkit-text-stroke: 2px var(--c-black); text-shadow: 5px 5px 0 var(--c-black); paint-order: stroke fill; letter-spacing: .03em; }
.timer.hot { color: var(--c-pop); }
.ice { background-color: var(--c-lemon); background-image: radial-gradient(rgba(15,13,10,.12) 2px, transparent 2.2px); background-size: 12px 12px; color: var(--c-black); border: 5px solid var(--c-black); box-shadow: 8px 8px 0 var(--c-black); border-radius: var(--r); padding: 26px 22px; min-height: 220px; display: grid; align-content: space-between; gap: 18px; transform: rotate(-1.5deg); }
.ice q { font: 900 26px/1.2 var(--font-body); quotes: none; }
.ice small { font: 800 11px/1.2 var(--font-body); letter-spacing: .12em; text-transform: uppercase; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* piramis */
.pyr { display: grid; gap: 4px; justify-items: center; margin-block: 6px 8px; width: 100%; }
.pyr i { display: block; height: 22px; border-radius: 3px; background: var(--c-paper); border: 2.5px solid var(--c-black); font: 16px/18px var(--font-display); color: var(--c-black); text-align: center; font-style: normal; box-shadow: 3px 3px 0 var(--c-black); }
.pyr i.done { background: var(--c-lime); }
.pyr i.cur { background: var(--c-lemon); animation: pulse .8s ease-in-out infinite alternate; }
.pyr i.fell { background: var(--c-pop); color: var(--c-paper); }
@keyframes pulse { to { transform: scale(1.04); } }
.tbar { height: 14px; border-radius: 3px; background: var(--c-paper); border: 3px solid var(--c-black); overflow: hidden; }
.tbar > div { height: 100%; background: var(--c-pop); transform-origin: left; }
.pyr-intro { display: grid; gap: 16px; }
.pyr-intro h1 { font: 60px/.9 var(--font-display); letter-spacing: .02em; color: var(--c-lemon); -webkit-text-stroke: 2.5px var(--c-black); text-shadow: 5px 5px 0 var(--c-black); paint-order: stroke fill; }
.pyr-intro ul { margin: 0; padding-left: 20px; color: var(--ink-dim); display: grid; gap: 6px; font-weight: 600; }

/* pia-számláló */
.drinks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.drink { position: relative; display: grid; gap: 4px; justify-items: start; text-align: left; border: 4px solid var(--c-black); background: var(--c-paper); color: var(--c-black); border-radius: var(--r); box-shadow: 6px 6px 0 var(--c-black); padding: 14px 14px 12px; min-height: 124px; transition: transform .08s, box-shadow .08s, background-color .2s; }
.drink:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--c-black); }
.drink .ic { font-size: 32px; line-height: 1; }
.drink b { font: 24px/1 var(--font-display); font-weight: 400; letter-spacing: .03em; }
.drink small { font-size: 12px; color: var(--c-muted); font-weight: 700; }
.drink .n { position: absolute; top: 8px; right: 12px; font: 50px/1 var(--font-display); color: var(--c-black); font-variant-numeric: tabular-nums; }
.drink .plus { position: absolute; right: 10px; bottom: 10px; font: 18px/1 var(--font-display); background: var(--c-black); color: var(--c-lemon); padding: 3px 6px 1px; border-radius: 3px; letter-spacing: .04em; }
.drink.pop { background: var(--c-lemon); }
.drink:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto 1fr; align-items: center; column-gap: 12px; background: #dff6ff; }
.drink:last-child:nth-child(odd) .ic { grid-row: span 2; }
.drink:last-child:nth-child(odd) .n { top: 50%; transform: translateY(-50%); right: 58px; }
.drink:last-child:nth-child(odd) .plus { bottom: auto; top: 50%; transform: translateY(-50%); }
.drink[disabled] { opacity: .6; }
.dsum { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--c-lime); border: 4px solid var(--c-black); box-shadow: 6px 6px 0 var(--c-black); border-radius: var(--r); padding: 12px 14px; color: var(--c-black); transform: rotate(-.6deg); }
.dsum .big { font: 64px/.9 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.dsum .lbl { font: 800 11px/1.3 var(--font-body); letter-spacing: .12em; text-transform: uppercase; }
.dsum .btn { font-size: 18px; padding: 9px 12px 7px; }
.badges { display: flex; flex-wrap: wrap; gap: 10px; }
.badge { font: 20px/1 var(--font-display); letter-spacing: .04em; padding: 7px 10px 5px; border-radius: 4px; background: var(--c-lemon); color: var(--c-black); border: var(--bd); box-shadow: 3px 3px 0 var(--c-black); }
.code-box { display: grid; justify-items: center; gap: 4px; background-color: var(--c-lemon); background-image: radial-gradient(rgba(15,13,10,.12) 2px, transparent 2.2px); background-size: 12px 12px; color: var(--c-black); border: 4px solid var(--c-black); box-shadow: 6px 6px 0 var(--c-black); border-radius: var(--r); padding: 16px; transform: rotate(-1deg); }
.code-box b { font: 84px/.9 var(--font-display); letter-spacing: .12em; padding-left: .12em; font-weight: 400; }
.code-box small { font: 800 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; }

/* főoldali piaszámláló */
.pia { grid-column: 1 / -1; background-color: var(--c-lemon); background-image: radial-gradient(rgba(15,13,10,.12) 2px, transparent 2.2px); background-size: 12px 12px; color: var(--c-black); border: 4px solid var(--c-black); border-radius: var(--r); box-shadow: 7px 7px 0 var(--c-black); padding: 14px 14px 12px; display: grid; gap: 10px; transform: rotate(.5deg);
  --ink: var(--c-black); --ink-dim: #3d3846; --ink-faint: var(--c-muted); --gold: var(--c-black); --line: var(--c-black); }
.pia-head { display: flex; justify-content: space-between; align-items: end; gap: 10px; }
.pia-head h2 { font: 38px/.9 var(--font-display); letter-spacing: .03em; }
.pia-head .k { font: 800 11px/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: #5b5320; }
.pia-head .big { font: 54px/.85 var(--font-display); text-align: right; }
.pia-head .big small { display: block; font: 800 10px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
.pia-rows { display: grid; gap: 6px; }
.pia-row { display: grid; grid-template-columns: 34px 1fr auto auto auto; align-items: center; gap: 8px; background: var(--c-paper); border: 3px solid var(--c-black); border-radius: 4px; padding: 5px 6px 5px 8px; }
.pia-row svg { width: 26px; height: 30px; color: var(--c-black); }
.pia-row .nm { font: 21px/1 var(--font-display); letter-spacing: .03em; min-width: 0; }
.pia-row .nm small { display: block; font: 700 11px/1.2 var(--font-body); color: var(--c-muted); letter-spacing: 0; }
.pia-row .cnt { font: 34px/1 var(--font-display); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.pia-row button { width: 44px; height: 44px; border: 3px solid var(--c-black); border-radius: 4px; font: 30px/1 var(--font-display); display: grid; place-items: center; padding-top: 3px; box-shadow: 3px 3px 0 var(--c-black); transition: transform .06s, box-shadow .06s; }
.pia-row button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--c-black); }
.pia-row .minus { background: var(--c-paper); color: var(--c-black); font: 900 28px/1 var(--font-body); padding-top: 0; }
.pia-row .plus { background: var(--c-pop); color: var(--c-paper); text-shadow: 2px 2px 0 var(--c-black); }
.pia-row button[disabled] { opacity: .35; box-shadow: none; }
.pia-row.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { background: var(--c-lime); } 100% { background: var(--c-paper); } }
.pia .badges { gap: 6px; }
.pia .badge { font-size: 16px; padding: 5px 8px 3px; }
.pia-note { font: 700 12px/1.3 var(--font-body); color: #5b5320; text-align: center; }
/* ital-ikonok a ranglistán */
.row .dr { display: inline-flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.row .dr span { display: inline-flex; align-items: center; gap: 1px; font: 16px/1 var(--font-display); color: var(--c-paper); font-variant-numeric: tabular-nums; }
.row .dr svg { width: 14px; height: 17px; color: var(--c-paper); flex: none; }
.row { grid-template-columns: 34px minmax(0, 1fr) auto auto; }
body.tv .row .dr span { font-size: 24px; }
body.tv .row .dr svg { width: 21px; height: 25px; }
/* piramis kor-statisztika */
.agestat { background: var(--c-lime); color: var(--c-black); border: var(--bd); box-shadow: var(--sh); border-radius: var(--r); padding: 12px 14px; font-weight: 700; display: grid; gap: 4px; }
.agestat b { font: 28px/1 var(--font-display); font-weight: 400; letter-spacing: .03em; }
.club { width: 100%; text-align: left; background: var(--c-paper); color: var(--c-black); border: var(--bd); border-radius: var(--r); box-shadow: var(--sh); padding: 10px 14px; }
.club summary { font: 22px/1.1 var(--font-display); letter-spacing: .03em; cursor: pointer; }
.club ol { margin: 8px 0 2px; padding-left: 22px; display: grid; gap: 3px; font-weight: 700; }
.mode-intro { background: var(--c-paper); color: var(--c-black); border: var(--bd); border-radius: var(--r); box-shadow: var(--sh); padding: 14px 16px; font-weight: 600; font-size: 15px; display: grid; gap: 4px; }
.mode-intro b { font: 24px/1 var(--font-display); font-weight: 400; letter-spacing: .03em; }

/* felugró */
.pop { text-align: center; }
.pop .photo { aspect-ratio: 1; max-width: 220px; justify-self: center; width: 100%; transform: rotate(-3deg); }
.pop h2 { color: var(--c-pop); -webkit-text-stroke: 1.5px var(--c-black); text-shadow: 3px 3px 0 var(--c-black); paint-order: stroke fill; }

/* ===== kivetítő ===== */
body.tv #app { max-width: none; padding: 28px 36px; height: 100vh; }
.tvgrid { display: grid; grid-template-columns: 1.25fr 1fr 0.8fr; grid-template-rows: auto 1fr; gap: 28px; height: 100%; }
.tvtitle { grid-column: 1 / -1; display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.tvtitle h1 { font: 72px/.9 var(--font-display); letter-spacing: .02em; color: var(--c-lemon); -webkit-text-stroke: 2.5px var(--c-black); text-shadow: 5px 5px 0 var(--c-black); paint-order: stroke fill; }
.tvtitle h1 span { color: var(--c-pop); }
.tvtitle .meta-row { font-size: 15px; }
.tvcol { display: grid; gap: 16px; align-content: start; min-height: 0; overflow: hidden; padding: 0 8px 8px 0; }
.tvcol h3 { font: 30px/1 var(--font-display); letter-spacing: .04em; color: var(--c-lemon); -webkit-text-stroke: 1px var(--c-black); text-shadow: 3px 3px 0 var(--c-black); }
body.tv .row { grid-template-columns: 48px minmax(0, 1fr) auto auto; padding: 6px 4px; }
body.tv .row .nm { font-size: 24px; }
body.tv .row .val { font-size: 30px; }
body.tv .row .pos { font-size: 26px; }
.feed { display: grid; gap: 10px; }
.feed div { background: var(--c-paper); color: var(--c-black); border: var(--bd); box-shadow: 4px 4px 0 var(--c-black); border-radius: 4px; padding: 10px 12px; font-size: 17px; font-weight: 700; animation: rise .4s ease-out; }
.feed b { font: 22px/1 var(--font-display); letter-spacing: .03em; font-weight: 400; }
.feed small { display: block; color: var(--c-muted); font: 800 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
.feed .empty { color: var(--ink-dim); }
.wall { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wall figure { margin: 0; position: relative; border-radius: 4px; overflow: hidden; aspect-ratio: 1; background: var(--c-paper); border: 4px solid var(--c-black); box-shadow: 5px 5px 0 var(--c-black); }
.wall img { width: 100%; height: 100%; object-fit: cover; }
.wall figcaption { position: absolute; inset: auto 0 0; padding: 6px 8px 4px; font: 18px/1 var(--font-display); letter-spacing: .03em; background: var(--c-lemon); color: var(--c-black); border-top: 3px solid var(--c-black); }
.qrbox { background: var(--c-paper); border: 5px solid var(--c-black); box-shadow: 8px 8px 0 var(--c-lime); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; justify-items: center; color: var(--c-black); transform: rotate(1deg); }
.qrbox b { font: 32px/1 var(--font-display); letter-spacing: .03em; font-weight: 400; text-align: center; }
.qrbox #qr img, .qrbox #qr canvas { width: 100% !important; max-width: 230px; height: auto !important; }

/* ===== mobil stabilitás ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
@supports (overflow: clip) { html, body { overflow-x: clip; } }
button, a, input, label, .photo, .opt, .tile { touch-action: manipulation; }
body.lock { overflow: hidden; }
.scrim { overscroll-behavior: contain; }
.sheet { max-height: 88dvh; }
.sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
img { -webkit-user-drag: none; }

/* ragadós fejléc: a vissza gomb mindig bal felül marad */
.top { position: sticky; top: 0; z-index: 40; min-height: 64px;
  margin: -12px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(21, 17, 29, .94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 3px solid var(--c-black); }
.backbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 9px 14px 6px 10px; background: var(--c-paper); color: var(--c-black); border: var(--bd); border-radius: 4px; box-shadow: 3px 3px 0 var(--c-black); font: 22px/1 var(--font-display); letter-spacing: .04em; }
.backbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--c-black); }
.backbtn .ar { font: 900 20px/1 var(--font-body); margin-top: -3px; }
.sheet-top { position: sticky; top: -22px; z-index: 2; margin: -22px -20px 0; padding: 12px 14px; background: var(--c-paper); border-bottom: 3px solid var(--c-black); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-top b { font: 22px/1 var(--font-display); letter-spacing: .03em; }
.photo.zoomable { cursor: zoom-in; }
.photo .zoom-hint { position: absolute; right: 6px; bottom: 6px; z-index: 2; background: var(--c-black); color: var(--c-lemon); font: 800 10px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 6px 4px; border-radius: 3px; pointer-events: none; }
.stk-grid .photo .zoom-hint { display: none; }
.stk-grid .photo { padding: 0; }

/* esküvői gyűjtés kártya */
.wed { background: var(--c-pop); color: var(--c-black); border: 4px solid var(--c-black); border-radius: var(--r); box-shadow: 7px 7px 0 var(--c-black); padding: 14px 16px; display: grid; gap: 8px; transform: rotate(-.4deg); }
.wed h2 { font: 34px/.95 var(--font-display); letter-spacing: .03em; color: var(--c-paper); -webkit-text-stroke: 1.5px var(--c-black); text-shadow: 3px 3px 0 var(--c-black); paint-order: stroke fill; }
.wed p { font-weight: 700; font-size: 15px; line-height: 1.35; }
.wed .how { background: var(--c-paper); border: 3px solid var(--c-black); border-radius: 4px; padding: 8px 10px; font-weight: 800; }
.wed details { background: var(--c-paper); border: 3px solid var(--c-black); border-radius: 4px; padding: 8px 10px; }
.wed summary { font: 20px/1.1 var(--font-display); letter-spacing: .03em; cursor: pointer; }
.wed ol { list-style: none; margin: 8px 0 2px; padding: 0; display: grid; gap: 6px; }
.wed li { display: grid; grid-template-columns: 76px 1fr; gap: 8px; font-size: 13px; font-weight: 600; line-height: 1.3; }
.wed li b { font: 17px/1.1 var(--font-display); letter-spacing: .02em; background: var(--c-lemon); border: 2px solid var(--c-black); border-radius: 3px; text-align: center; padding: 3px 2px 1px; align-self: start; }
.wed li strong { font-weight: 900; }
/* mi történik (feed) */
.act-list { display: grid; gap: 12px; }
.act-item { background: var(--c-paper); color: var(--c-black); border: var(--bd); border-radius: var(--r); box-shadow: 5px 5px 0 var(--c-black); padding: 12px 14px; display: grid; gap: 6px; }
.act-item .who { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.act-item .who b { font: 22px/1 var(--font-display); letter-spacing: .03em; }
.act-item .who span { font: 20px/1 var(--font-display); background: var(--c-lime); border: 2px solid var(--c-black); border-radius: 3px; padding: 3px 6px 1px; white-space: nowrap; }
.act-item .what { font-weight: 700; font-size: 15px; line-height: 1.3; }
.act-item small { font: 800 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--c-muted); }
.act-item .pf { width: 100%; max-height: 260px; object-fit: cover; border-radius: 4px; border: 3px solid var(--c-black); cursor: zoom-in; display: block; }
.act-item.bonus { background: var(--c-lemon); }
.qcount { font: 800 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--c-muted); }

/* nagyító (lightbox) */
.lb { position: fixed; inset: 0; z-index: 90; background: rgba(15, 13, 10, .96); display: grid; grid-template-rows: auto 1fr auto; overscroll-behavior: contain; touch-action: pan-y; animation: fadein .15s ease-out; }
.lb-top, .lb-bot { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
.lb-bot { padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(14px, env(safe-area-inset-left, 0px)); }
.lb-cnt { font: 22px/1 var(--font-display); color: var(--c-lemon); letter-spacing: .04em; }
.lb-stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 0 12px; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border: 4px solid var(--c-black); border-radius: 6px; box-shadow: 0 0 0 3px var(--c-paper), 8px 8px 0 3px var(--c-lime); background: #15111d; user-select: none; -webkit-user-select: none; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: var(--bd); background: var(--c-paper); color: var(--c-black); font: 900 24px/1 var(--font-body); display: grid; place-items: center; box-shadow: 3px 3px 0 var(--c-black); }
.lb-nav.prev { left: 6px; } .lb-nav.next { right: 6px; }
.lb-bot .btn { flex: 1; font-size: 22px; }

@media (max-width: 380px) { .menu { grid-template-columns: 1fr; } .tile.main { grid-template-columns: 1fr; } .tile.main .big { text-align: left; } .drinks { grid-template-columns: 1fr; } }
</style>

</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
(function () {
"use strict";
const C = window.CONFIG, K = window.CONTENT;
const $app = document.getElementById("app");
const $layer = document.getElementById("layer");

/* ---------- segédek ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const questById = id => K.quests.find(q => q.id === id) || (K.bonuses || []).find(b => b.id === id);
const firstName = n => { const t = String(n || "").trim().split(/\s+/); const last = t[t.length - 1] || ""; return t.length > 1 && !/\.$/.test(last) && last.length > 1 ? last : t[0]; };
const ICON = {
  sor: `<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M4.5 8h11.5v15.5a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2z" fill="#fff04a"/><path d="M4 7h12.5v16.5a2.5 2.5 0 0 1-2.5 2.5H6.5A2.5 2.5 0 0 1 4 23.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 10.5h2.5a2 2 0 0 1 2 2v5.5a2 2 0 0 1-2 2h-2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 8c-.4-2.6 2-4.4 4.3-3.6 1.2-2.4 5-2.3 5.9.2 2.2-.6 4.6.8 4.3 3.4z" fill="#fffbe8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.3 12.5v9M12.2 12.5v9" stroke="currentColor" stroke-width="1.4" opacity=".45"/></svg>`,
  bor: `<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M6.4 8h11.2l-.1 1.2a5.5 5.5 0 0 1-11 0z" fill="#ff4d6d"/><path d="M6 3h12l-.5 6.2a5.5 5.5 0 0 1-11 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 14.7V24M7.5 25.5h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  longdrink: `<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M14.5 1.5 11.5 12" stroke="#ff4d6d" stroke-width="2.2" stroke-linecap="round"/><path d="M5.9 11.5h12.2l-1 13.5H6.9z" fill="#c6f432"/><path d="M5 6h14l-1.5 20h-11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="18.6" cy="6.2" r="3.3" fill="#fff04a" stroke="currentColor" stroke-width="1.5"/></svg>`,
  feles: `<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M6.4 13h11.2l-1.1 9H7.5z" fill="#fff04a"/><path d="M5 8h14l-1.8 15H6.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 23h12v3H6z" fill="currentColor"/></svg>`,
  viz: `<svg viewBox="0 0 24 28" aria-hidden="true"><path d="M6.3 12h11.4l-1.1 12.5H7.4z" fill="#7fd8ff"/><path d="M5 6h14l-1.6 20H6.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 14.5c-1.5 2-2.2 3-2.2 4a2.2 2.2 0 0 0 4.4 0c0-1-.7-2-2.2-4z" fill="#fffbe8"/></svg>`
};
const DRINK_COLS = { sor: "beers", bor: "wines", longdrink: "longdrinks", feles: "shots", viz: "waters" };
const fmtPts = n => (Math.round(n * 10) / 10).toString().replace(".", ",");
const newCode = () => String(Math.floor(1000 + Math.random() * 9000));
const fmtTime = ms => (ms / 1000).toFixed(1).replace(".", ",") + " mp";
const ago = iso => { const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000); if (s < 60) return "most"; if (s < 3600) return Math.floor(s / 60) + " perce"; return Math.floor(s / 3600) + " órája"; };

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* matricák: a CONFIG.STICKERS sorszámaiból */
const STK = (C.STICKERS || []).map(Number).filter(n => n > 0);
const stkSrc = n => `img/adam-${n}.jpg`;
const stkAt = i => STK.length ? STK[((i % STK.length) + STK.length) % STK.length] : null;
// i = hányadik a listában; num = konkrét matrica-sorszám (ha meg van adva, az nyer)
function photoHTML(i, cls = "", num) {
  const n = num != null && STK.includes(Number(num)) ? Number(num) : stkAt(i);
  return `<div class="photo zoomable ${cls}" ${n ? `data-act="zoom" data-n="${n}" role="button" aria-label="Kép nagyban"` : ""}><div class="ph">Ide jön egy kép Ádámról</div>${n ? `<img src="${esc(stkSrc(n))}" alt="Ádám" loading="lazy" onerror="this.remove()"><span class="zoom-hint">Nagyít</span>` : ""}</div>`;
}

/* ---------- nagyító + letöltés ---------- */
const HEADS = ["fej-1-szomoru", "fej-2-semleges", "fej-3-vidam", "fej-4-csillogo", "fej-5-szivarvany", "fej-i1-kacsint", "fej-i2-nyelv", "fej-i3-asit", "fej-i4-meglepett", "fej-i5-napszemuveg", "fej-i6-alszik", "fej-i7-puszi", "fej-i8-morcos"];
const LB = { list: [], i: 0, el: null, blobs: new Map() };
function lbItems() { return STK.map(n => ({ src: stkSrc(n), name: `adam-matrica-${n}.jpg` })).concat(HEADS.map(h => ({ src: `img/${h}.png`, name: `adam-${h}.png` }))); }
function openLightbox(src, items) {
  LB.list = items || lbItems(); LB.i = Math.max(0, LB.list.findIndex(x => x.src === src));
  if (!LB.el) { LB.el = document.createElement("div"); LB.el.className = "lb"; LB.el.setAttribute("role", "dialog"); LB.el.setAttribute("aria-modal", "true"); document.body.appendChild(LB.el); }
  document.body.classList.add("lock");
  drawLightbox();
}
function drawLightbox() {
  const it = LB.list[LB.i]; if (!it || !LB.el) return;
  LB.el.innerHTML = `<div class="lb-top"><button class="backbtn" data-act="lb-close"><span class="ar">←</span> Vissza</button><span class="lb-cnt">${LB.i + 1} / ${LB.list.length}</span></div>
    <div class="lb-stage"><img src="${esc(it.src)}" alt="Ádám, nagyban"><button class="lb-nav prev" data-act="lb-prev" aria-label="Előző">‹</button><button class="lb-nav next" data-act="lb-next" aria-label="Következő">›</button></div>
    <div class="lb-bot"><button class="btn gold" data-act="lb-dl">Letöltöm</button></div>`;
  prefetchBlob(it);
}
function closeLightbox() { if (LB.el) { LB.el.remove(); LB.el = null; } if (!$layer.innerHTML) document.body.classList.remove("lock"); }
function lbStep(d) { if (!LB.list.length) return; LB.i = (LB.i + d + LB.list.length) % LB.list.length; drawLightbox(); }
function prefetchBlob(it) { if (!LB.blobs.has(it.src)) LB.blobs.set(it.src, fetch(it.src).then(r => r.ok ? r.blob() : null).catch(() => null)); return LB.blobs.get(it.src); }
async function downloadCurrent() {
  const it = LB.list[LB.i]; if (!it) return;
  const blob = await prefetchBlob(it);
  if (!blob) { window.open(it.src, "_blank"); return; }
  const file = new File([blob], it.name, { type: blob.type || "image/jpeg" });
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = it.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
  toast("Letöltve");
}
// lapozás húzással
(() => {
  let x0 = null, y0 = 0;
  document.addEventListener("touchstart", e => { if (LB.el && LB.el.contains(e.target)) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 == null || !LB.el) { x0 = null; return; }
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) lbStep(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener("keydown", e => { if (!LB.el) return; if (e.key === "Escape") closeLightbox(); if (e.key === "ArrowRight") lbStep(1); if (e.key === "ArrowLeft") lbStep(-1); });
})();

/* képtömörítés feltöltés előtt */
function compressImage(file, maxSide = 1280, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("blob")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

/* ---------- ADAT: Supabase vagy demó ---------- */
const LIVE = !!(C.SUPABASE_URL && C.SUPABASE_KEY && window.supabase);

const DemoStore = (() => {
  const db = ls.get("bp_demo_db", null) || seed();
  function seed() {
    const names = ["Demó Dóri", "Minta Márk", "Teszt Tomi", "Próba Panni", "Példa Peti", "Kamu Kata"];
    const d = { players: [], completions: [], scores: [], drinks: [] };
    names.forEach((n, i) => {
      const id = "demo-" + i; d.players.push({ id, name: n, level: 1 + (i % 3) });
      shuffle(K.quests.filter((q, k) => k % 3 !== i % 3)).slice(0, 2 + (i % 4)).forEach((q, k) =>
        d.completions.push({ id: uid(), player_id: id, player_name: n, quest_id: q.id, points: q.pts, photo_url: null, created_at: new Date(Date.now() - (i * 7 + k * 3) * 60000).toISOString() }));
      d.scores.push({ player_id: id, player_name: n, kind: "pyramid", score: 2 * (2 + ((i * 3) % 7)), time_ms: 40000 + i * 9300 });
      d.scores.push({ player_id: id, player_name: n, kind: "age", score: [29, 28, 29, 30, 29, 27][i], time_ms: 0 });
      d.scores.push({ player_id: id, player_name: n, kind: "adam", score: [5, 3, 5, 4, 2, 5][i], time_ms: 5 });
      ["sor", "sor", "longdrink", "feles", "bor", "feles", "viz"].slice(0, 2 + i).forEach((k, j) => d.drinks.push({ id: uid(), player_id: id, player_name: n, kind: k, created_at: new Date(Date.now() - j * 600000).toISOString() }));
    });
    return d;
  }
  if (!db.drinks) db.drinks = [];
  const save = () => ls.set("bp_demo_db", db);
  const later = v => new Promise(r => setTimeout(() => r(v), 120));
  return {
    async createPlayer(name, code) { const p = { id: uid(), name, level: null, code }; db.players.push(p); save(); return later({ id: p.id, name: p.name, level: p.level }); },
    async nameTaken(name) { return later(db.players.some(p => p.name.toLowerCase() === name.toLowerCase())); },
    async resume(name, code) { const p = db.players.slice().reverse().find(p => p.name.toLowerCase() === name.trim().toLowerCase() && p.code === code.trim()); return later(p ? { id: p.id, name: p.name, level: p.level } : null); },
    async playerExists(id) { return later(db.players.some(p => p.id === id)); },
    async myDrinks(id) { return later(db.drinks.filter(d => d.player_id === id)); },
    async addDrink(me, kind) { const d = { id: uid(), player_id: me.id, player_name: me.name, kind, created_at: new Date().toISOString() }; db.drinks.push(d); save(); return later(d); },
    async removeDrink(id) { db.drinks = db.drinks.filter(d => d.id !== id); save(); return later(true); },
    async drinkCount() { return later(db.drinks.filter(d => d.kind !== "viz").length); },
    async questCount() { return later(db.completions.filter(c => String(c.quest_id).startsWith("q")).length); },
    async setLevel(id, level) { const p = db.players.find(x => x.id === id); if (p) p.level = level; save(); return later(true); },
    async myCompletions(id) { return later(db.completions.filter(c => c.player_id === id)); },
    async complete(me, q, blob) {
      if (db.completions.some(c => c.player_id === me.id && c.quest_id === q.id)) throw new Error("dup");
      let photo_url = null;
      if (blob) photo_url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      const c = { id: uid(), player_id: me.id, player_name: me.name, quest_id: q.id, points: q.pts, photo_url, created_at: new Date().toISOString() };
      db.completions.push(c); save(); return later(c);
    },
    async uncomplete(me, qid) { db.completions = db.completions.filter(c => !(c.player_id === me.id && c.quest_id === qid)); save(); return later(true); },
    async leaderboard(n = 50) {
      const m = new Map(db.players.map(p => [p.id, { player_id: p.id, name: p.name, points: 0, quests: 0, beers: 0, wines: 0, longdrinks: 0, shots: 0, waters: 0 }]));
      db.completions.forEach(c => { const r = m.get(c.player_id); if (r) { r.points += Number(c.points); if (String(c.quest_id).startsWith("q")) r.quests++; } });
      db.drinks.forEach(d => { const r = m.get(d.player_id); if (r && DRINK_COLS[d.kind]) r[DRINK_COLS[d.kind]]++; });
      return later([...m.values()].slice(0, n));
    },
    async activity(n = 60) { return later(db.completions.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n)); },
    async questCounts() { return later(db.completions.map(c => ({ quest_id: c.quest_id }))); },
    async feed(n = 12) { return later(db.completions.slice().sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n)); },
    async photos(n = 6) { return later(db.completions.filter(c => c.photo_url).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, n)); },
    async getScore(id, kind) { return later(db.scores.find(s => s.player_id === id && s.kind === kind) || null); },
    async saveScore(me, kind, score, time_ms) {
      const ex = db.scores.find(s => s.player_id === me.id && s.kind === kind);
      if (ex) Object.assign(ex, { score, time_ms }); else db.scores.push({ player_id: me.id, player_name: me.name, kind, score, time_ms });
      save(); return later(true);
    },
    async scoreBoard(kind, n = 20) { return later(db.scores.filter(s => s.kind === kind).sort((a, b) => b.score - a.score || a.time_ms - b.time_ms).slice(0, n)); },
    async allScores(kind) { return later(db.scores.filter(s => s.kind === kind).map(s => ({ score: s.score }))); },
    reset() { ls.del("bp_demo_db"); }
  };
})();

const SupaStore = (() => {
  if (!LIVE) return null;
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { persistSession: false } });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async createPlayer(name, code) { return ok(await sb.from("players").insert({ name, code }).select("id,name,level").single()); },
    async nameTaken(name) { const pat = name.replace(/[\\%_]/g, m => "\\" + m); const rows = ok(await sb.from("players").select("id").ilike("name", pat).limit(1)); return rows.length > 0; },
    async resume(name, code) { const rows = ok(await sb.rpc("resume_player", { p_name: name, p_code: code })); return rows && rows[0] ? rows[0] : null; },
    async playerExists(id) { const rows = ok(await sb.from("players").select("id").eq("id", id).limit(1)); return rows.length > 0; },
    async myDrinks(id) { return ok(await sb.from("drinks").select("id,kind,created_at").eq("player_id", id).order("created_at")); },
    async addDrink(me, kind) { return ok(await sb.from("drinks").insert({ player_id: me.id, player_name: me.name, kind }).select("id,kind,created_at").single()); },
    async removeDrink(id) { ok(await sb.from("drinks").delete().eq("id", id)); return true; },
    async drinkCount() { const { count, error } = await sb.from("drinks").select("id", { count: "exact", head: true }).neq("kind", "viz"); if (error) throw error; return count || 0; },
    async questCount() { const { count, error } = await sb.from("completions").select("id", { count: "exact", head: true }).like("quest_id", "q%"); if (error) throw error; return count || 0; },
    async setLevel(id, level) { ok(await sb.from("players").update({ level }).eq("id", id)); return true; },
    async myCompletions(id) { return ok(await sb.from("completions").select("*").eq("player_id", id)); },
    async complete(me, q, blob) {
      let photo_url = null;
      if (blob) {
        const path = `${me.id}/${q.id}-${Date.now()}.jpg`;
        ok(await sb.storage.from("proofs").upload(path, blob, { contentType: "image/jpeg", upsert: false }));
        photo_url = sb.storage.from("proofs").getPublicUrl(path).data.publicUrl;
      }
      return ok(await sb.from("completions").insert({ player_id: me.id, player_name: me.name, quest_id: q.id, points: q.pts, photo_url }).select().single());
    },
    async uncomplete(me, qid) { ok(await sb.from("completions").delete().eq("player_id", me.id).eq("quest_id", qid)); return true; },
    async leaderboard(n = 1000) { return ok(await sb.from("leaderboard").select("*").limit(n)); },
    async activity(n = 60) { return ok(await sb.from("completions").select("player_name,quest_id,points,photo_url,created_at").order("created_at", { ascending: false }).limit(n)); },
    async questCounts() { return ok(await sb.from("completions").select("quest_id").like("quest_id", "q%").limit(5000)); },
    async feed(n = 12) { return ok(await sb.from("completions").select("player_name,quest_id,points,photo_url,created_at").order("created_at", { ascending: false }).limit(n)); },
    async photos(n = 6) { return ok(await sb.from("completions").select("player_name,quest_id,photo_url,created_at").not("photo_url", "is", null).order("created_at", { ascending: false }).limit(n)); },
    async getScore(id, kind) { return ok(await sb.from("scores").select("*").eq("player_id", id).eq("kind", kind).maybeSingle()); },
    async saveScore(me, kind, score, time_ms) { ok(await sb.from("scores").upsert({ player_id: me.id, player_name: me.name, kind, score, time_ms }, { onConflict: "player_id,kind" })); return true; },
    async scoreBoard(kind, n = 20) { return ok(await sb.from("scores").select("*").eq("kind", kind).order("score", { ascending: false }).order("time_ms", { ascending: true }).limit(n)); },
    async allScores(kind) { return ok(await sb.from("scores").select("score").eq("kind", kind).limit(2000)); }
  };
})();

const store = SupaStore || DemoStore;

/* ---------- állapot ---------- */
const S = {
  me: ls.get("bp_me", null),          // {id, name, level}
  done: new Map(),                    // quest_id -> completion
  drinks: [],                         // saját pia-bejegyzések
  board: [],
  view: "home",
  questCat: "konnyu",
  busy: false,
  pyrPts: 0,                          // kvízpiramis legjobb eredménye pontban (beleszámít az összesbe)
  homePhoto: Math.floor(Math.random() * 99)
};

// Ranglista: side questek + bónuszok (leaderboard nézet) + a kvízpiramis legjobb eredménye
async function getBoard(n = 50) {
  const [rows, pyr] = await Promise.all([store.leaderboard(1000), store.scoreBoard("pyramid", 1000).catch(() => [])]);
  const pm = new Map((pyr || []).map(s => [s.player_id, Number(s.score) / 2]));
  return rows.map(r => ({ ...r, points: Number(r.points || 0) + (pm.get(r.player_id) || 0) }))
    .filter(r => r.points > 0)
    .sort((a, b) => b.points - a.points || Number(b.quests || 0) - Number(a.quests || 0) || String(a.name).localeCompare(String(b.name), "hu"))
    .slice(0, n);
}
function myRank() { const i = S.board.findIndex(r => r.player_id === S.me?.id); return i >= 0 ? i + 1 : null; }

async function refreshMine() {
  if (!S.me) return;
  try { const rows = await store.myCompletions(S.me.id); S.done = new Map(rows.map(r => [r.quest_id, r])); } catch (e) { console.warn(e); }
}
async function refreshDrinks() {
  if (!S.me) return;
  try { S.drinks = await store.myDrinks(S.me.id); } catch (e) { console.warn(e); }
}
const drinkN = k => S.drinks.filter(d => d.kind === k).length;
async function refreshBoard() {

/* lebegő matricák a nyitóképen (img/stk/stk-1..17.webp) */
let FLOAT_HTML = null;
function floatBoxHTML(pre) {
  if (FLOAT_HTML) return FLOAT_HTML;
  const N = Math.min(STK.length, 30), rnd = (a, b) => a + Math.random() * (b - a);
  // 5×4 rács, mindenki a saját cellájában lebeg, így mind látszik; a 3 üres cella véletlenszerű
  const cells = [...Array(30).keys()].sort(() => Math.random() - .5).slice(0, N);
  let h = "";
  cells.forEach((c, k) => {
    const col = c % 6, row = Math.floor(c / 6);
    const x = col * 16.6 + rnd(-2, 3), y = row * 20 + rnd(-2, 3), w = rnd(17, 20);
    const v = `--w:${w.toFixed(1)}%;--x:${x.toFixed(1)}%;--y:${y.toFixed(1)}%;--r0:${rnd(-16, 16).toFixed(1)}deg;--r1:${rnd(-18, 18).toFixed(1)}deg;--r2:${rnd(-18, 18).toFixed(1)}deg;` +
      `--x1:${rnd(-45, 45).toFixed(0)}%;--y1:${rnd(-35, 35).toFixed(0)}%;--x2:${rnd(-45, 45).toFixed(0)}%;--y2:${rnd(-35, 35).toFixed(0)}%;--x3:${rnd(-45, 45).toFixed(0)}%;--y3:${rnd(-35, 35).toFixed(0)}%;` +
      `--dur:${rnd(5, 9).toFixed(1)}s;--delay:-${rnd(0, 9).toFixed(1)}s;z-index:${Math.round(rnd(1, 9))}`;
    h += `<img class="stk" src="${pre}stk/stk-${STK[k]}.webp" alt="" loading="lazy" style="${v}" onerror="this.remove()">`;
  });
  return (FLOAT_HTML = `<div class="float-box">${h}</div>`);
}

function refreshPia(flashKind) {

}
async function addDrink(kind) {
  if (drinkBusy) return; drinkBusy = true;
  const d = K.drinks.find(x => x.k === kind);
  try {
    const row = await store.addDrink(S.me, kind);
    S.drinks.push(row);
    const n = drinkN(kind);
    const bonus = (K.bonuses || []).find(b => b.kind === kind && b.at === n && !S.done.has(b.id));
    if (bonus) {
      try {
        const c = await store.complete(S.me, { id: bonus.id, pts: bonus.pts }, null);
        S.done.set(bonus.id, c); refreshBoard();
        openSheet(`<div style="display:grid;gap:12px;text-align:center"><span class="step">Titkos bónusz</span>
          <h2 style="font-size:44px">${esc(bonus.name)}</h2><p style="color:var(--ink);font-size:18px;font-weight:800">+${bonus.pts} pont a ranglistán</p>
          <p>Ezt senki nem mondta előre. Most már tudod.</p><button class="btn block gold" data-act="close">Egészségedre!</button></div>`);
      } catch (e) { if (!(String(e.message).includes("dup") || e.code === "23505")) console.warn(e); }
    } else toast(`+1 ${d ? d.name : ""} · ${n}. ma este`);
  } catch (e) { console.error(e); toast("Nem sikerült menteni. Próbáld újra."); }
  finally { drinkBusy = false; refreshPia(kind); }
}
async function removeDrink(kind) {
  const mineK = S.drinks.filter(d => d.kind === kind);
  const last = mineK[mineK.length - 1];
  if (!last || drinkBusy) return; drinkBusy = true;
  try {
    await store.removeDrink(last.id);
    S.drinks = S.drinks.filter(d => d !== last);
    const n = drinkN(kind);
    for (const b of (K.bonuses || []).filter(b => b.kind === kind && n < b.at && S.done.has(b.id))) {
      await store.uncomplete(S.me, b.id).catch(console.warn); S.done.delete(b.id); refreshBoard();
    }
    toast("Egy levonva.");
  } catch (e) { toast("Nem sikerült. Próbáld újra."); }
  finally { drinkBusy = false; refreshPia(); }
}

/* ---------- Kvízpiramis ---------- */
// Pontozás: első próbálkozás = 1 pont / szint, minden további = pyramidRetryFactor pont / szint. A legjobb számít.
// A "pyramid" pontszámot fél pontokban tároljuk (egész szám), a "pyr_tries" a próbálkozások száma, az "age" az első kor-tipp.
let P = null;
const pLevels = () => K.pyramid.length + 1;
async function ageStats() {
  const rows = await store.allScores("age").catch(() => []);
  const right = Number(K.ageQuestion.a[K.ageQuestion.c]);
  const tips = rows.map(r => Number(r.score)).filter(a => a > 0);
  return { total: rows.length, right: tips.filter(a => a === right).length, older: tips.filter(a => a > right).length, younger: tips.filter(a => a < right).length };
}
async function renderPyramid() {
  if (S.view !== "pyramid") return;
  if (!P) {
    $app.innerHTML = `${header()}<p class="empty">Betöltés…</p>`;
    const [best, tries, age, board] = await Promise.all([
      store.getScore(S.me.id, "pyramid").catch(() => null), store.getScore(S.me.id, "pyr_tries").catch(() => null),
      store.getScore(S.me.id, "age").catch(() => null), store.scoreBoard("pyramid", 20).catch(() => [])]);
    if (S.view !== "pyramid" || P) return;
    const t = tries ? Number(tries.score) : (best ? 1 : 0);
    P = { phase: t ? "done" : "intro", best, tries: t, age, board, lvl: 0, qs: null, start: 0, qStart: 0, ans: null, timer: null, last: null, stats: null };
  }
  const levels = pLevels();
  const pyr = (cur, fell) => `<div class="pyr" aria-hidden="true">${Array.from({ length: levels }, (_, k) => { const lv = levels - 1 - k; return `<i style="width:${28 + (levels - lv) * 7}%" class="${lv < cur ? "done" : lv === cur ? (fell ? "fell" : "cur") : ""}">${lv + 1}</i>`; }).join("")}</div>`;

  if (P.phase === "intro") {
    $app.innerHTML = `${header()}<section class="pyr-intro">
      <h1>Kvízpiramis</h1>
      ${pyr(-1)}
      <ul><li>${levels} szint, mindegyik nehezebb az előzőnél. Az első egy könnyű bemelegítő a szülinaposról.</li><li>Kérdésenként ${K.pyramidSeconds} másodperc.</li><li>Egy rossz válasz vagy lejárt idő, és lezuhansz.</li><li>Minden megmászott szint 1 pont. <b style="color:var(--gold)">Újrapróbálni lehet, de akkor már csak fél pont jár szintenként.</b> A legjobb eredményed számít.</li></ul>
      <button class="btn block gold" data-act="pstart">Indulás a csúcsra</button>
      ${pBoard()}
    </section>`;
    return;
  }
  if (P.phase === "play") {
    const q = P.qs[P.lvl], ans = P.ans;
    const isAge = P.lvl === 0;
    $app.innerHTML = `${header()}<section class="quiz">
      <div class="qhead"><span>${P.lvl + 1}. szint / ${levels}${P.tries > 1 ? " · fél pontért" : ""}</span><span id="ptime">${K.pyramidSeconds} mp</span></div>
      ${pyr(P.lvl, ans !== null && ans !== q.c)}
      <div class="tbar"><div id="pbar"></div></div>
      <h2>${esc(q.q)}</h2>
      <div class="choices">${q.a.map((t, k) => { const cls = ans === null ? "" : k === q.c ? "right" : k === ans ? "wrong" : ""; return `<button class="opt ${cls}" data-act="pans" data-k="${k}" ${ans !== null ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span>${esc(t)}</button>`; }).join("")}</div>
      ${isAge && ans !== null && P.stats ? `<div class="agestat"><b>${P.stats.right} / ${P.stats.total} eltalálta</b>Ennyien tippelték el elsőre Ádám korát. ${P.stats.older} vendég idősebbnek gondolja, ${P.stats.younger} fiatalabbnak.</div>` : ""}
    </section>`;
    if (ans === null) runPTimer();
    return;
  }
  // done
  const bestPts = P.best ? Number(P.best.score) / 2 : 0;
  const L = P.last;
  const top = L && L.reached >= levels;
  $app.innerHTML = `${header()}<section class="result">
    <span class="step">Kvízpiramis · ${P.tries}. próbálkozás</span>
    <div class="score">${L ? L.reached : Math.round(bestPts)}/${levels}</div>
    <p>${L ? (top ? "A csúcson vagy. Ezt kevesen mondhatják el." : L.reached === 0 ? "Az első lépcsőnél csúsztál el. Előfordul a legjobbakkal is." : `A ${L.reached}. szintig jutottál, ${fmtTime(L.time_ms)} alatt. Ez ${fmtPts(L.pts)} pont.`) : ""}
      A legjobb eredményed: <b style="color:var(--gold)">${fmtPts(bestPts)} pont</b>.</p>
    ${pyr(L ? L.reached : -1, L && !top)}
    <button class="btn block gold" data-act="pstart">Újra (fél pontért)</button>
    ${pBoard()}
    <button class="btn block ghost" data-go="home">Főoldal</button>
  </section>`;
}
function pBoard() {
  const b = (P.board || []).filter(r => Number(r.score) > 0);
  return `<div class="section" style="width:100%;text-align:left"><h3>Örökranglista</h3>${b.length ? `<div class="board">${b.slice(0, 10).map((r, i) => boardRow({ ...r, name: r.player_name }, i, `${fmtPts(Number(r.score) / 2)} p`, true)).join("")}</div>` : `<div class="empty">Még senki nem mászott.</div>`}</div>`;
}
function runPTimer() {
  clearInterval(P.timer);
  P.qStart = Date.now();
  const total = K.pyramidSeconds * 1000;
  P.timer = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - P.qStart));
    const bar = document.getElementById("pbar"), lab = document.getElementById("ptime");
    if (bar) bar.style.transform = `scaleX(${left / total})`;
    if (lab) lab.textContent = Math.ceil(left / 1000) + " mp";
    if (left <= 0) { clearInterval(P.timer); pAnswer(-1); }
  }, 100);
}
async function startPyramid() {
  const aq0 = K.ageQuestion;
  P.qs = [{ q: aq0.q, a: aq0.a.slice(), c: aq0.c }].concat(K.pyramid.map(pair => { const q = pick(pair); const order = shuffle([0, 1, 2, 3]); return { q: q.q, a: order.map(i => q.a[i]), c: order.indexOf(q.c) }; }));
  P.tries += 1; P.phase = "play"; P.lvl = 0; P.ans = null; P.start = Date.now(); P.stats = null; P.last = null;
  await store.saveScore(S.me, "pyr_tries", P.tries, 0).catch(console.warn); // a próbálkozás elindult
  renderPyramid();
}
async function pAnswer(k) {
  if (!P || P.phase !== "play" || P.ans !== null) return;
  const G = P;                         // ez a játék; ha közben kilépett, nem írunk rá más nézetre
  clearInterval(P.timer);
  const q = P.qs[P.lvl];
  P.ans = k;
  const right = k === q.c;
  if (k === -1) toast("Lejárt az idő!");
  let wait = right ? 900 : 1800;
  if (G.lvl === 0) {
    if (!G.age) { G.age = { score: k >= 0 ? Number(q.a[k]) : 0 }; await store.saveScore(S.me, "age", G.age.score, 0).catch(console.warn); }
    G.stats = await ageStats(); wait = 2600;
    if (P !== G) return;
  }
  renderPyramid();
  const elapsed = Date.now() - G.start;
  const reached = right ? G.lvl + 1 : G.lvl;
  const factor = G.tries > 1 ? (K.pyramidRetryFactor ?? 0.5) : 1;
  const half = Math.round(reached * factor * 2);
  const prev = G.best ? Number(G.best.score) : -1;
  if (half > prev || (half === prev && P.best && elapsed < Number(P.best.time_ms))) {
    G.best = { score: half, time_ms: elapsed };
    S.pyrPts = half / 2; setHTML("ptspill", `${fmtPts(myPoints())} pont`);
    await store.saveScore(S.me, "pyramid", half, elapsed).catch(console.warn);
  }
  setTimeout(async () => {
    if (P !== G) return;
    if (right && G.lvl + 1 < pLevels()) { G.lvl++; G.ans = null; renderPyramid(); return; }
    G.last = { reached, time_ms: elapsed, pts: reached * factor };
    G.board = await store.scoreBoard("pyramid", 20).catch(() => G.board);
    if (P !== G) return;
    G.phase = "done"; renderPyramid(); refreshBoard();
  }, wait);
}

    openSheet(`<div class="sheet-top"><button class="backbtn" data-act="close"><span class="ar">←</span> Vissza</button><b>${STK.length} matrica</b></div>
      <h2>Ádám, matricában</h2><p>${STK.length} matrica + ${HEADS.length} fej a kivetítőről. Koppints egyre: nagyban látod, és le is töltheted.</p>
      <div class="stk-grid">${STK.map(n => photoHTML(0, "", n)).join("")}</div>
      <div class="stk-grid">${HEADS.map(h => `<div class="photo sq zoomable" data-act="zoom" role="button" aria-label="Kép nagyban"><img src="img/${h}.png" alt="Ádám feje" loading="lazy" onerror="this.parentNode.remove()"></div>`).join("")}</div>
      <button class="btn block" data-act="close">Bezár</button>`);
    return;
  }
  if (a === "dplus") { queueDrink(() => addDrink(el.dataset.k)); return; }
  if (a === "dminus") { queueDrink(() => removeDrink(el.dataset.k)); return; }
  if (a === "logout") {
    openSheet(`<h2>Kilépsz?</h2><p>A pontjaid megmaradnak ${esc(S.me.name)} néven.${S.me.code ? ` Visszalépni a neveddel és a <b style="color:var(--ink)">${esc(S.me.code)}</b> kóddal tudsz.` : ""}</p>
      <div class="row-btns"><button class="btn ghost" data-act="close">Maradok</button><button class="btn" data-act="logout-yes">Kilépek</button></div>`);
    return;
  }
  if (a === "logout-yes") { closeSheet(); ls.del("bp_me"); S.me = null; S.done = new Map(); S.drinks = []; S.pyrPts = 0; S.board = []; joinMode = "new"; render(); return; }
  if (a === "cattab") { S.questCat = el.dataset.c; renderQuests(); return; }
  if (a === "done") { const q = questById(el.dataset.q); if (q) confirmQuest(q); return; }
  if (a === "undo") {
    const q = questById(el.dataset.q);
    openSheet(`<h2>Visszavonod?</h2><p>${esc(q.t)}</p><div class="row-btns"><button class="btn ghost" data-act="close">Mégse</button><button class="btn" data-act="undo-yes" data-q="${q.id}">Visszavonom</button></div>`);
    return;
  }
  if (a === "undo-yes") {
    const id = el.dataset.q;
    try { await store.uncomplete(S.me, id); S.done.delete(id); closeSheet(); toast("Visszavonva."); refreshBoard(); render(); }
    catch (e) { toast("Nem sikerült. Próbáld újra."); }
    return;
  }
  if (a === "aq") { if (aq.answered !== null) return; const k = Number(el.dataset.k); aq.answered = k; const ok = k === K.adamQuiz[aq.i].c; aq.marks[aq.i] = ok; if (ok) aq.score++; renderAdamQuiz(); return; }
  if (a === "aq-next") { aq.i++; aq.answered = null; renderAdamQuiz(); window.scrollTo(0, 0); return; }
  if (a === "aq-again") { aq = { i: 0, score: 0, answered: null, marks: [], prev: true, stats: aq && aq.stats }; renderAdamQuiz(); return; }
  if (a === "ttab") { T.tab = el.dataset.t; renderTopics(); return; }
  if (a === "newd") { let n; do { n = pick(K.dilemmas); } while (n === T.d && K.dilemmas.length > 1); T.d = n; T.assign = null; renderTopics(); return; }
  if (a === "newice") { let n; do { n = pick(K.icebreakers); } while (n === T.ice && K.icebreakers.length > 1); T.ice = n; renderTopics(); return; }
  if (a === "flip") { T.assign = Math.random() < 0.5 ? ["Te védd ezt", "A másik ezt"] : ["A másik ezt", "Te védd ezt"]; renderTopics(); return; }
  if (a === "timer") {
    if (T.timerEnd) { T.timerEnd = 0; clearInterval(T.timerId); T.timerId = null; }
    else { T.timerEnd = Date.now() + 120000; clearInterval(T.timerId); T.timerId = setInterval(tickTimer, 250); }
    renderTopics(); return;
  }
  if (a === "pstart") { if (P) await startPyramid(); return; }
  if (a === "pans") { pAnswer(Number(el.dataset.k)); return; }
});

/* ===================== KIVETÍTŐS NÉZET (#tv) ===================== */
async function renderTV() {
  document.body.classList.add("tv");
  $app.innerHTML = `<div class="tvgrid">
    <div class="tvtitle"><h1>ÁDÁM <span>SIDE QUESTEK</span></h1><div class="meta-row"><span>2026. nov. 7.</span><span>Pacsi</span><span id="tvq">– quest</span><span id="tvd">– ital</span><span id="tva">– kor-tipp</span><span id="tvall">– mindent tud</span>${LIVE ? "" : "<span>Demó</span>"}</div></div>
    <div class="tvcol"><h3>Ranglista</h3><div class="board" id="tvboard"></div></div>
    <div class="tvcol"><h3>Kvízpiramis csúcsai</h3><div class="board" id="tvpyr"></div><h3 style="margin-top:10px">Most történt</h3><div class="feed" id="tvfeed"></div></div>
    <div class="tvcol"><div class="qrbox"><b>Szállj be te is</b><div id="qr"></div></div><h3>Bizonyítékok</h3><div class="wall" id="tvwall"></div></div>
  </div>`;
  try { if (window.QRCode) new QRCode(document.getElementById("qr"), { text: C.APP_URL || (location.origin + location.pathname), width: 220, height: 220, colorDark: "#0f0d0a", colorLight: "#fffbe8" }); } catch (e) {}
  const tick = async () => {
    try {
      const [board, pyr, feed, pics, qn, dn] = await Promise.all([getBoard(10), store.scoreBoard("pyramid", 5), store.feed(6), store.photos(4), store.questCount().catch(() => null), store.drinkCount().catch(() => null)]);
      if (qn !== null) document.getElementById("tvq").textContent = qn + " kész quest";
      if (dn !== null) document.getElementById("tvd").textContent = dn + " ital";
      const as = await ageStats(); if (as.total) document.getElementById("tva").textContent = `${as.older} idősebbnek · ${as.younger} fiatalabbnak gondolja`;
      const ad = await adamStats(); document.getElementById("tvall").textContent = `${ad.perfect.length} mindent tud Ádámról`;
      document.getElementById("tvboard").innerHTML = board.length ? board.map((r, i) => boardRow(r, i)).join("") : `<div class="empty">Még üres. Olvasd be a QR-kódot!</div>`;
      document.getElementById("tvpyr").innerHTML = pyr.filter(r => Number(r.score) > 0).length ? pyr.filter(r => Number(r.score) > 0).map((r, i) => boardRow({ ...r, name: r.player_name }, i, `${fmtPts(Number(r.score) / 2)} p`, true)).join("") : `<div class="empty">Még senki nem mászott.</div>`;
      document.getElementById("tvfeed").innerHTML = feed.map(c => { const q = questById(c.quest_id); return `<div><b>${esc(c.player_name)}</b> +${c.points} p · ${esc(q ? (q.name ? q.name + " (titkos bónusz)" : q.t) : "")}<small>${ago(c.created_at)}</small></div>`; }).join("") || `<div class="empty">Itt jelennek meg a teljesített questek.</div>`;
      document.getElementById("tvwall").innerHTML = pics.map(c => `<figure><img src="${esc(c.photo_url)}" alt=""><figcaption>${esc(c.player_name)}</figcaption></figure>`).join("") || `<div class="empty" style="grid-column:1/-1">A nehéz questek fotói ide kerülnek.</div>`;
    } catch (e) { console.warn(e); }
  };
  await tick(); setInterval(tick, 8000);
}

/* ---------- indulás ---------- */
async function boot() {
  if (location.hash === "#tv") return renderTV();
  if (location.hash === "#demo-reset" && !LIVE) { DemoStore.reset(); ls.del("bp_me"); location.hash = ""; location.reload(); return; }
  if (S.me) {
    $app.innerHTML = `<p class="empty" style="margin-top:40px">Betöltés…</p>`;
    let exists = true;
    try { exists = await store.playerExists(S.me.id); } catch (e) { console.warn(e); }
    if (!exists) { ls.del("bp_me"); S.me = null; return renderJoin("A korábbi belépésed már nem él (lenulláztuk a játékot). Lépj be újra."); }
    await Promise.all([refreshMine(), refreshDrinks(), refreshBoard()]); schedulePopup();
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  render();
  // ranglista + pontok frissítése: csak a változó részeket írja át (nem ugrik az oldal)
  setInterval(() => { if (S.me && !document.hidden) { refreshBoard(); if (S.view === "activity" && !LB.el) { const y = scrollY; renderActivity().then(() => scrollTo(0, y)); } if (S.view === "quests") refreshQuestCounts(); } }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) { refreshMine().then(refreshBoard); } });
}
window.addEventListener("hashchange", () => location.reload());
boot();
})();
</script>
